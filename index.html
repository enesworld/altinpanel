const AnimatedValue = React.memo(({ value, prev }) => {
  if (value === undefined || value === null || isNaN(value) || value === 0) {
    return <div className="text-xl text-gray-300 font-bold">...</div>;
  }
  let cls = "text-xl font-bold tracking-tight transition-all duration-500";
  if (prev && value !== prev) cls = value > prev ? "flash-up" : "flash-down";
  return (
    <div className={cls}>
      {fp(Math.round(value))} <span className="text-sm font-normal text-gray-400">₺</span>
    </div>
  );
});

function LoginModal({ onClose, onLoginSuccess }) {
  const [email, setEmail] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [error, setError] = React.useState("");
  async function login() {
    const { data, error } = await supa.auth.signInWithPassword({ email, password });
    if (error) setError("Hatalı giriş!"); else onLoginSuccess(data.user);
  }
  return (
    <div className="modal-backdrop">
      <div className="modal">
        <h3 className="text-lg font-bold text-yellow-700 mb-4">Yönetici Paneli</h3>
        <input className="w-full p-3 mb-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 ring-yellow-200 outline-none" type="email" placeholder="E-posta" value={email} onChange={e=>setEmail(e.target.value)} />
        <input className="w-full p-3 mb-4 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 ring-yellow-200 outline-none" type="password" placeholder="Şifre" value={password} onChange={e=>setPassword(e.target.value)} />
        {error && <div className="text-red-500 text-xs mb-3">{error}</div>}
        <div className="flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded text-gray-500 hover:bg-gray-100">İptal</button>
          <button onClick={login} className="px-4 py-2 rounded bg-yellow-600 text-white font-bold shadow-lg shadow-yellow-200">Giriş</button>
        </div>
      </div>
    </div>
  );
}

function AdminModal({ open, draft, setDraft, showcaseDraft, setShowcaseDraft, onClose, onSave }) {
  if (!open || !draft) return null;
  const [uploading, setUploading] = React.useState(false);
  const [refreshing, setRefreshing] = React.useState(false);
  const safeShowcase = showcaseDraft || { aktif: false, baslik: "", aciklama: "", fiyat: "", resim: "" };
  
  const updateVitrin = (key, value) => { if (setShowcaseDraft) setShowcaseDraft({ ...safeShowcase, [key]: value }); };
  
  const handleFileUpload = async (event) => {
    try {
      const file = event.target.files[0];
      if (!file) return;
      setUploading(true);
      const fileName = `vitrin_${Date.now()}`;
      const { data, error } = await supa.storage.from('resimler').upload(fileName, file); 
      if (error) throw error;
      const { data: { publicUrl } } = supa.storage.from('resimler').getPublicUrl(fileName);
      updateVitrin('resim', publicUrl);
    } catch (error) { alert('Hata: ' + error.message); } finally { setUploading(false); }
  };

  const forceRefreshAll = async () => {
    setRefreshing(true);
    try {
        const { data } = await supa.from('altin_politika').select('versiyon').eq('id', 1).single();
        const yeniVersiyon = (data?.versiyon || 1) + 1;
        await supa.from('altin_politika').update({ versiyon: yeniVersiyon }).eq('id', 1);
        alert("Komut gönderildi!");
    } catch (e) { alert("Hata: " + e.message); } finally { setRefreshing(false); }
  };

  const fields = [ ["ceyrek_alis", "Çeyrek Alış"], ["ceyrek_satis", "Çeyrek Satış"], ["ata_alis", "Ata Alış"], ["ata_satis", "Ata Satış"], ["gram22", "22K Fark"], ["gram24", "24K Fark"] ];

  return (
    <div className="modal-backdrop">
      <div className="modal max-w-sm max-h-[90vh] overflow-y-auto">
        <h3 className="text-lg font-bold text-yellow-700 mb-2 border-b pb-2">Yönetici Paneli</h3>
        <div className="mb-4">
            <h4 className="text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-wider">Fiyat Politikası</h4>
            <div className="grid grid-cols-2 gap-2 mb-3">
            {fields.map(([k, l]) => (
                <div key={k} className="flex flex-col">
                <label className="text-[9px] text-gray-500 uppercase">{l}</label>
                <input type="number" value={draft[k]} onChange={e=>setDraft({...draft, [k]: Number(e.target.value)})} className="p-2 border rounded text-right font-mono text-sm outline-none focus:border-yellow-500" />
                </div>
            ))}
            </div>
            <div className="flex gap-2">
                <button onClick={()=>{ setDraft({ ...draft, ceyrek_alis:-150, ceyrek_satis:200, ata_alis:-800, ata_satis:1000, gram22:170, gram24:170 }); }} className="flex-1 bg-red-100 text-red-700 text-[10px] py-2 rounded font-bold hover:bg-red-200">Makası Aç ✂️</button>
                <button onClick={()=>{ setDraft({ ...draft, ceyrek_alis:-100, ceyrek_satis:150, ata_alis:-250, ata_satis:800, gram22:100, gram24:110 }); }} className="flex-1 bg-blue-100 text-blue-700 text-[10px] py-2 rounded font-bold hover:bg-blue-200">Makası Azalt 📉</button>
            </div>
        </div>
        <div className="mb-4 pt-4 border-t border-dashed">
            <h4 className="text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-wider">Kayan Yazı</h4>
            <input type="text" placeholder="Duyuru metni..." value={draft.duyuru || ""} onChange={e=>setDraft({...draft, duyuru: e.target.value})} className="w-full p-2 border rounded text-xs focus:border-yellow-500 outline-none" />
        </div>
        <div className="mb-4 pt-4 border-t border-dashed">
            <h4 className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Vitrin Ürünü</h4>
            <label className="flex items-center gap-2 text-xs mb-2 cursor-pointer">
                <span className={safeShowcase.aktif ? "text-green-600 font-bold" : "text-gray-400"}>{safeShowcase.aktif ? "Yayında" : "Gizli"}</span>
                <input type="checkbox" checked={safeShowcase.aktif || false} onChange={e=>updateVitrin('aktif', e.target.checked)} />
            </label>
            <div className="space-y-2">
                <input type="text" placeholder="Başlık" value={safeShowcase.baslik || ""} onChange={e=>updateVitrin('baslik', e.target.value)} className="w-full p-2 border rounded text-xs focus:border-yellow-500 outline-none" />
                <input type="text" placeholder="Açıklama" value={safeShowcase.aciklama || ""} onChange={e=>updateVitrin('aciklama', e.target.value)} className="w-full p-2 border rounded text-xs focus:border-yellow-500 outline-none" />
                <input type="text" placeholder="Fiyat" value={safeShowcase.fiyat || ""} onChange={e=>updateVitrin('fiyat', e.target.value)} className="w-full p-2 border rounded text-xs focus:border-yellow-500 outline-none" />
                <div className="border p-2 rounded bg-gray-50">
                  <div className="flex justify-between items-center mb-1"><label className="text-[9px] text-gray-500 uppercase">Resim</label>{uploading && <span className="text-[9px] text-blue-600 font-bold animate-pulse">...</span>}</div>
                  <input type="file" accept="image/*" onChange={handleFileUpload} className="block w-full text-xs text-slate-500 mb-2" />
                  <input type="text" placeholder="Veya link" value={safeShowcase.resim || ""} onChange={e=>updateVitrin('resim', e.target.value)} className="w-full p-1 border rounded text-[10px]" />
                </div>
            </div>
        </div>
        <div className="flex flex-col gap-3 border-t pt-3">
            <button onClick={forceRefreshAll} disabled={refreshing} className="w-full bg-gray-800 text-white text-[10px] py-2 rounded font-bold hover:bg-black transition">{refreshing ? "..." : "🔄 Tüm Cihazları Yenile"}</button>
            <div className="flex justify-end gap-2">
                <button onClick={onClose} className="px-3 py-2 rounded text-gray-500 hover:bg-gray-100 text-sm">Vazgeç</button>
                <button disabled={uploading} onClick={onSave} className="px-4 py-2 rounded bg-yellow-600 text-white font-bold shadow text-sm hover:bg-yellow-700 transition disabled:opacity-50">Kaydet</button>
            </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = React.useState('welcome');
  const [prices, setPrices] = React.useState({});
  const [prevPrices, setPrevPrices] = React.useState({});
  const [lastUpdate, setLastUpdate] = React.useState(null);
  const [user, setUser] = React.useState(null);
  const [policy, setPolicy] = React.useState(null);
  const [draft, setDraft] = React.useState(null);
  const [showcase, setShowcase] = React.useState(null);     
  const [showcaseDraft, setShowcaseDraft] = React.useState(null);
  const [loginOpen, setLoginOpen] = React.useState(false);
  const [adminOpen, setAdminOpen] = React.useState(false);
  const [stability, setStability] = React.useState(0);
  const [currentVersion, setCurrentVersion] = React.useState(null);
  const [dataError, setDataError] = React.useState(false);

  React.useEffect(() => {
    async function init() {
      const { data: pData } = await supa.from("altin_politika").select("*").eq("id", 1).single();
      if (pData) { setPolicy(pData); setDraft(pData); if(pData.versiyon) setCurrentVersion(pData.versiyon); }
      const { data: vData } = await supa.from("vitrin").select("*").eq("id", 1).single();
      if(vData) { setShowcase(vData); setShowcaseDraft(vData); }
    }
    init();
  }, []);

  React.useEffect(() => {
      const checkVersion = async () => {
          const { data } = await supa.from('altin_politika').select('versiyon').eq('id', 1).single();
          if (currentVersion && data?.versiyon && data.versiyon !== currentVersion) window.location.reload(); 
      };
      const timer = setInterval(checkVersion, 10000);
      return () => clearInterval(timer);
  }, [currentVersion]);

  React.useEffect(() => {
    if(!policy) return;
    
    const num = (v) => {
        if (!v) return 0;
        let str = v.toString().replace(/[^0-9.,-]/g, '').replace(/\./g, '').replace(',', '.');
        return parseFloat(str) || 0;
    };
    
    const getVal = (data, ...keys) => { for (let k of keys) { if (data[k]) return data[k]; } return null; };
    
    async function load() {
      try {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), 10000);
        const res = await fetch(API_URL, { signal: controller.signal });
        clearTimeout(id);
        
        if (!res.ok) throw new Error("Ağ Hatası");
        const json = await res.json();
        const d = json.data; 

        if (!d) { setDataError(true); return; }
        setDataError(false);

        const P = policy;
        const rawQ  = getVal(d, 'CEYREK_ESKI', 'CEYREK', 'YENI_CEYREK');
        const rawA  = getVal(d, 'ATA_ESKI', 'ATA', 'CUMHURIYET');
        const raw22 = getVal(d, 'AYAR22', '22AYAR');
        const raw24 = getVal(d, 'ALTIN', 'HASALTIN', 'GRAM');

        if (!rawQ || !rawA || !raw22 || !raw24) return;

        const newP = {
          qBuy: Math.round(num(rawQ.alis) + num(P.ceyrek_alis)),
          qSell: Math.round(num(rawQ.satis) + num(P.ceyrek_satis)),
          aBuy: Math.round(num(rawA.alis) + num(P.ata_alis)),
          aSell: Math.round(num(rawA.satis) + num(P.ata_satis)),
          g22: Math.round(num(raw22.satis) + num(P.gram22)),
          g24: Math.round(num(raw24.satis) + num(P.gram24)),
        };
        newP.s025 = Math.round(newP.g24 * (num(P.g025) || 0.33));
        newP.s0522 = Math.round(newP.g22 * (num(P.g05_22) || 0.539));
        newP.s0524 = Math.round(newP.g24 * (num(P.g05_24) || 0.52));

        setPrices(prev => {
          if(JSON.stringify(prev) !== JSON.stringify(newP)) setStability(0);
          setPrevPrices(prev);
          return newP;
        });
        setLastUpdate(new Date());
      } catch (e) {
        setDataError(true);
      }
    }
    load();
    const t = setInterval(load, 10000); 
    const s = setInterval(() => setStability(c => c+1), 1000);
    return () => { clearInterval(t); clearInterval(s); }
  }, [policy]);

  const downloadImage = async () => {
    const el = document.getElementById("capture-area");
    if(!el) return;
    const canvas = await html2canvas(el, { scale: 3, backgroundColor: null, useCORS: true });
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/png");
    link.download = `Fiyatlar_${new Date().toLocaleDateString()}.png`;
    link.click();
  }

  const handleSave = async () => {
      await supa.from("altin_politika").update(draft).eq("id", 1);
      setPolicy(draft);
      await supa.from("vitrin").update(showcaseDraft).eq("id", 1);
      setShowcase(showcaseDraft);
      setAdminOpen(false);
  };

  // --- EKRAN YÖNETİMİ ---
  if (view === 'welcome') return <WelcomeScreen onSelect={(v) => setView(v)} />;
  if (view === 'showcase') return <FullShowcase showcase={showcase} onBack={() => setView('welcome')} />;

  return (
    <div className="min-h-screen pb-16 flex flex-col items-center bg-gray-50 fade-in">
      
      <div className="fixed top-0 left-0 w-full p-4 flex justify-between items-start z-50 pointer-events-none">
        <div className="pointer-events-auto flex gap-2">
          <button onClick={() => setView('welcome')} className="bg-white/80 backdrop-blur text-gray-600 w-10 h-10 rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">🏠</button>
          {user && <button onClick={async()=>{await supa.auth.signOut(); setUser(null);}} className="bg-white/80 backdrop-blur text-red-600 px-3 py-1 rounded-full shadow text-xs font-bold h-10 flex items-center">Çıkış</button>}
        </div>
        <div className="flex gap-3 pointer-events-auto">
          <button onClick={() => window.open('ham.html', '_blank')} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">📜</button>
          <button onClick={() => window.open('profit.html', '_blank')} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">📟</button>
          <button onClick={downloadImage} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">📸</button>
          <button onClick={()=>(user?setAdminOpen(true):setLoginOpen(true))} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">⚙️</button>
        </div>
      </div>

      <div id="capture-area" className="mt-20 relative w-full max-w-xl p-8 bg-gradient-to-br from-[#fff7ed] via-[#fff] to-[#fef3c7] rounded-[2rem] shadow-2xl border border-orange-100">
        
        {dataError && (
            <div className="absolute top-0 left-0 w-full bg-red-600 text-white text-[10px] font-bold text-center py-2 z-50 animate-pulse rounded-t-[2rem]">
                ⚠️ VERİ AKIŞI SAĞLANAMIYOR - Fiyatlar Güncel Değil
            </div>
        )}

        <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-yellow-200 via-yellow-500 to-yellow-200 opacity-60"></div>
        <div className="flex justify-center -mt-16 mb-4 relative z-10">
           <a href="https://www.instagram.com/bakirkoykuyumcusu/" target="_blank">
             <img src="bk.jpeg" className="h-28 w-28 rounded-full border-[6px] border-white shadow-xl object-cover bg-white" alt="logo" crossOrigin="anonymous" />
           </a>
        </div>
        <div className="text-center mb-8">
          <h1 className="text-4xl font-serif font-bold text-yellow-800 tracking-tight drop-shadow-sm">Bakırköy Kuyumcusu</h1>
          <div className="text-xs font-bold tracking-[0.3em] text-yellow-600 mt-2 uppercase opacity-80">{new Date().toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'})}</div>
        </div>
        <div className="bg-white/90 backdrop-blur-sm rounded-2xl p-6 shadow-inner border border-white/60">
          <Row title="Çeyrek Altın" buy={prices.qBuy} sell={prices.qSell} prevBuy={prevPrices.qBuy} prevSell={prevPrices.qSell} />
          <Row title="Ata Altın" buy={prices.aBuy} sell={prices.aSell} prevBuy={prevPrices.aBuy} prevSell={prevPrices.aSell} />
          <div className="grid grid-cols-2 gap-4 mt-6">
            <Box title="22 Ayar Gram" value={prices.g22} prev={prevPrices.g22} />
            <Box title="24 Ayar Gram" value={prices.g24} prev={prevPrices.g24} />
          </div>
          <div className="grid grid-cols-3 gap-3 mt-4">
            <SmallBox title="0.25g (24K)" value={prices.s025} />
            <SmallBox title="0.50g (22K)" value={prices.s0522} />
            <SmallBox title="0.50g (24K)" value={prices.s0524} />
          </div>
          <div className="mt-6 pt-4 border-t border-dashed border-gray-200 flex justify-between items-center text-[10px] text-gray-400 font-mono">
            <span>Saat: {ft(lastUpdate)}</span>
            <span className="tracking-widest font-bold text-gray-300">BAKIRKOYKUYUMCUSU</span>
          </div>
        </div>

        {showcase && showcase.aktif && (
          <div className="mt-6 mx-2 bg-white/90 backdrop-blur-sm p-4 rounded-2xl shadow-lg border border-yellow-100 flex flex-col items-center text-center animate-pop">
             <div className="text-[10px] font-bold text-gray-400 tracking-widest uppercase mb-3">✨ VİTRİN FIRSATI</div>
             <div className="flex gap-4 items-center w-full">
                {showcase.resim ? (
                  <img src={showcase.resim} className="w-20 h-20 rounded-xl object-cover border border-gray-100 shadow-md" alt="Ürün" />
                ) : (
                  <div className="w-20 h-20 rounded-xl bg-gray-100 border border-gray-200 flex items-center justify-center text-xs text-gray-400">Resim Yok</div>
                )}
                <div className="flex-1 text-left">
                   <div className="font-serif font-bold text-gray-800 text-lg leading-tight">{showcase.baslik}</div>
                   <div className="text-xs text-gray-500 mb-1">{showcase.aciklama}</div>
                   <div className="font-bold text-2xl text-yellow-700">{showcase.fiyat}</div>
                </div>
             </div>
             <button onClick={() => window.open('https://ig.me/m/bakirkoykuyumcusu', '_blank')} className="w-full mt-4 bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 text-white text-xs font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">
               <span className="text-lg">💬</span> Sipariş Ver (DM)
             </button>
          </div>
        )}

        <div className="mt-8 text-center text-yellow-800/40 font-serif italic text-sm">"Güvenin ve Kalitenin Adresi"</div>
      </div>
      
      {stability > 30 && <div className="mt-4 text-xs text-gray-400 animate-pulse">● Piyasa durağan</div>}

      {policy && policy.duyuru && (
        <div className="fixed bottom-0 left-0 w-full bg-gray-900 text-yellow-500 py-2 z-40 overflow-hidden border-t border-yellow-600 shadow-2xl">
            <div className="marquee-container">
                <div className="marquee-content">
                    <span className="text-sm font-bold tracking-[0.2em] uppercase px-8">{policy.duyuru} •</span>
                    <span className="text-sm font-bold tracking-[0.2em] uppercase px-8">{policy.duyuru} •</span>
                    <span className="text-sm font-bold tracking-[0.2em] uppercase px-8">{policy.duyuru} •</span>
                    <span className="text-sm font-bold tracking-[0.2em] uppercase px-8">{policy.duyuru} •</span>
                </div>
            </div>
        </div>
      )}

      {loginOpen && <LoginModal onClose={()=>setLoginOpen(false)} onLoginSuccess={(u)=>{setUser(u); setLoginOpen(false); setAdminOpen(true);}} />}
      
      {adminOpen && (
          <AdminModal 
            open={adminOpen} 
            draft={draft} setDraft={setDraft} 
            showcaseDraft={showcaseDraft} setShowcaseDraft={setShowcaseDraft}
            onClose={()=>setAdminOpen(false)} 
            onSave={handleSave} 
          />
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
