<script type="text/babel">

// --- GÜVENLİ FETCH ---
async function safeFetch(url, timeout = 3500, retries = 2) {
  for (let i = 0; i <= retries; i++) {
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);
      if (!res.ok) throw new Error(res.status);
      const json = await res.json();
      if (!json.data) throw new Error("Format hatası");
      return json;
    } catch (err) {
      if (i === retries) return null;
      await new Promise(r => setTimeout(r, 500));
    }
  }
}

// --- BİLEŞENLER ---

const AnimatedValue = React.memo(({ value, prev }) => {
  let cls = "text-xl font-bold tracking-tight transition-all duration-500";
  if (prev && value !== prev) cls = value > prev ? "flash-up" : "flash-down";
  
  return (
    <div className={cls}>
      {fp(Math.round(value))} <span className="text-sm font-normal text-gray-400">₺</span>
    </div>
  );
});

const Row = ({ title, buy, sell, prevBuy, prevSell }) => (
  <div className="flex justify-between items-center py-4 border-b border-gray-100 last:border-0">
    {/* İsimler kırılmasın diye whitespace-nowrap eklendi */}
    <div className="font-bold text-gray-700 text-lg whitespace-nowrap pr-2">{title}</div>
    <div className="flex gap-4 text-right">
      <div className="flex flex-col">
        <span className="text-[10px] text-gray-400 uppercase tracking-wider">Alış</span>
        <AnimatedValue value={buy} prev={prevBuy} />
      </div>
      <div className="flex flex-col">
        <span className="text-[10px] text-yellow-600 uppercase tracking-wider">Satış</span>
        <AnimatedValue value={sell} prev={prevSell} />

);

const SmallBox = ({ title, value, prev }) => (

    <div className="font-bold text-gray-800">
      {fp(Math.round(value))} <span className="text-[9px] text-gray-400">₺</span>
    </div>
  </div>
);

// --- MODALLAR ---
function LoginModal({ onClose, onLoginSuccess }) {
  const [email, setEmail] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [error, setError] = React.useState("");

  async function login() {
    const { data, error } = await supa.auth.signInWithPassword({ email, password });
    if (error) setError("Hatalı giriş!");
    else onLoginSuccess(data.user);
  }

  return (
    <div className="modal-backdrop">
      <div className="modal">
        <h3 className="text-lg font-bold text-yellow-700 mb-4">Yönetici Paneli</h3>
        <input className="w-full p-3 mb-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 ring-yellow-200 outline-none" type="email" placeholder="E-posta" value={email} onChange={e=>setEmail(e.target.value)} />
        <input className="w-full p-3 mb-4 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 ring-yellow-200 outline-none" type="password" placeholder="Şifre" value={password} onChange={e=>setPassword(e.target.value)} />
        {error && <div className="text-red-500 text-xs mb-3">{error}</div>}
        <div className="flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded text-gray-500 hover:bg-gray-100">İptal</button>
          <button onClick={login} className="px-4 py-2 rounded bg-yellow-600 text-white font-bold shadow-lg shadow-yellow-200">Giriş</button>
        </div>
      </div>
    </div>
  );
}

function AdminModal({ open, draft, setDraft, onClose, onSave }) {
  if (!open || !draft) return null;
  const fields = [
    ["ceyrek_alis", "Çeyrek Alış"], ["ceyrek_satis", "Çeyrek Satış"],
    ["ata_alis", "Ata Alış"], ["ata_satis", "Ata Satış"],
    ["gram22", "22K Fark"], ["gram24", "24K Fark"]
  ];

  return (
    <div className="modal-backdrop">
      <div className="modal max-w-sm">
        <h3 className="text-lg font-bold text-yellow-700 mb-4">Fiyat Makas Ayarı</h3>
        <div className="grid grid-cols-2 gap-x-4 gap-y-2 mb-4">
          {fields.map(([k, l]) => (
            <div key={k} className="flex flex-col">
              <label className="text-[10px] text-gray-500">{l}</label>
              <input type="number" value={draft[k]} onChange={e=>setDraft({...draft, [k]: Number(e.target.value)})} className="p-2 border rounded text-right font-mono" />
            </div>
          ))}
        </div>
        <div className="flex justify-between items-center pt-2 border-t">
          <button onClick={()=>{ setDraft({ ...draft, ceyrek_alis:-150, ceyrek_satis:200, ata_alis:-800, ata_satis:1000, gram22:170, gram24:170 }); }} className="text-xs bg-red-100 text-red-700 px-2 py-1 rounded">Makas Aç</button>
          <div className="flex gap-2">
            <button onClick={onClose} className="px-3 py-2 rounded text-gray-500">Kapat</button>
            <button onClick={onSave} className="px-3 py-2 rounded bg-green-600 text-white shadow-lg">Kaydet</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// --- ANA UYGULAMA ---
function App() {
  const [prices, setPrices] = React.useState({});
  const [prevPrices, setPrevPrices] = React.useState({});
  const [lastUpdate, setLastUpdate] = React.useState(null);
  const [user, setUser] = React.useState(null);
  const [policy, setPolicy] = React.useState(null);
  const [draft, setDraft] = React.useState(null);
  
  const [loginOpen, setLoginOpen] = React.useState(false);
  const [adminOpen, setAdminOpen] = React.useState(false);
  const [stability, setStability] = React.useState(0);

  // Veri Çekme
  React.useEffect(() => {
    async function init() {
      const { data } = await supa.from("altin_politika").select("*").eq("id", 1).single();
      setPolicy(data); setDraft(data);
    }
    init();
  }, []);

  React.useEffect(() => {
    if(!policy) return;
    const num = (v) => Number(v) || 0;
    
    async function load() {
      const j = await safeFetch(API);
      if (!j) return;
      const d = j.data;
      const P = policy;

      const newP = {
        qBuy: Math.round(num(d.CEYREK_ESKI.alis) + num(P.ceyrek_alis)),
        qSell: Math.round(num(d.CEYREK_ESKI.satis) + num(P.ceyrek_satis)),
        aBuy: Math.round(num(d.ATA_ESKI.alis) + num(P.ata_alis)),
        aSell: Math.round(num(d.ATA_ESKI.satis) + num(P.ata_satis)),
        g22: Math.round(num(d.AYAR22.satis) + num(P.gram22)),
        g24: Math.round(num(d.ALTIN.satis) + num(P.gram24)),
      };
      // Küçük gram hesapları
      newP.s025 = Math.round(newP.g24 * num(P.g025));
      newP.s0522 = Math.round(newP.g22 * num(P.g05_22));
      newP.s0524 = Math.round(newP.g24 * num(P.g05_24));

      setPrices(prev => {
        if(JSON.stringify(prev) !== JSON.stringify(newP)) setStability(0);
        setPrevPrices(prev);
        return newP;
      });
      setLastUpdate(new Date());
    }
    
    load();
    const t = setInterval(load, 10000); 
    const s = setInterval(() => setStability(c => c+1), 1000);
    return () => { clearInterval(t); clearInterval(s); }
  }, [policy]);

  const downloadImage = async () => {
    const el = document.getElementById("capture-area");
    if(!el) return;
    const canvas = await html2canvas(el, { scale: 3, backgroundColor: null, useCORS: true });
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/png");
    link.download = `Fiyatlar_${new Date().toLocaleDateString()}.png`;
    link.click();
  }

  return (
    <div className="min-h-screen pb-10 flex flex-col items-center bg-gray-50">

        <div className="pointer-events-auto">
          {user && <button onClick={async()=>{await supa.auth.signOut(); setUser(null);}} className="bg-white/80 backdrop-blur text-red-600 px-3 py-1 rounded-full shadow text-xs font-bold">Çıkış</button>}
        </div>
        <div className="flex gap-3 pointer-events-auto">
          <button onClick={() => window.open('ham.html', '_blank')} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">📜</button>
          <button onClick={() => window.open('profit.html', '_blank')} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">📟</button>
          <button onClick={downloadImage} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">📸</button>
          <button onClick={()=>(user?setAdminOpen(true):setLoginOpen(true))} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">⚙️</button>
        </div>
      </div>

      {/* --- FOTOĞRAF ALANI (Kartı Genişlettik: max-w-xl) --- */}

        id="capture-area" 
        className="mt-20 relative w-full max-w-xl p-8 bg-gradient-to-br from-[#fff7ed] via-[#fff] to-[#fef3c7] rounded-[2rem] shadow-2xl border border-orange-100"
      >
        {/* Dekoratif Çizgi */}
        <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-yellow-200 via-yellow-500 to-yellow-200 opacity-60"></div>

            <SmallBox title="0.50g (22K)" value={prices.s0522} />
            <SmallBox title="0.50g (24K)" value={prices.s0524} />
          </div>

          <div className="mt-6 pt-4 border-t border-dashed border-gray-200 flex justify-between items-center text-[10px] text-gray-400 font-mono">
            <span>Saat: {ft(lastUpdate)}</span>
            <span className="tracking-widest font-bold text-gray-300">BAKIRKOYKUYUMCUSU</span>
          </div>
        </div>

        <div className="mt-8 text-center text-yellow-800/40 font-serif italic text-sm">
          "Güvenin ve Kalitenin Adresi"
        </div>
      </div>
      
      {stability > 30 && <div className="mt-4 text-xs text-gray-400 animate-pulse">● Piyasa durağan</div>}

      {/* Modallar */}
      {loginOpen && <LoginModal onClose={()=>setLoginOpen(false)} onLoginSuccess={(u)=>{setUser(u); setLoginOpen(false); setAdminOpen(true);}} />}
      {adminOpen && <AdminModal open={adminOpen} draft={draft} setDraft={setDraft} onClose={()=>setAdminOpen(false)} onSave={async()=>{ await supa.from("altin_politika").update(draft).eq("id", 1); setPolicy(draft); setAdminOpen(false); }} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
