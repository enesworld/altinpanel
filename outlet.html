<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Outlet Fırsatları - Bakırköy Kuyumcusu</title>
    <meta name="theme-color" content="#fdfcf8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #fdfcf8; -webkit-tap-highlight-color: transparent; }
        
        /* Grid için özel stil */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 0.75rem; 
        }
        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 1rem; backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }
        .modal { transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        .modal-backdrop.active .modal { transform: scale(1); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Resim geçişi için stil */
        #modal-img { transition: opacity 0.3s ease-in-out; opacity: 0; }
    </style>
</head>
<body class="text-gray-800 antialiased font-sans select-none fade-in bg-[#fdfcf8]">

    <!-- Üst Bar (Sticky) -->
    <div class="fixed top-0 left-0 w-full z-50 bg-[#fdfcf8]/95 backdrop-blur-sm border-b border-gray-100 shadow-sm">
        <div class="p-4 flex items-center justify-between">
            <a href="index.html" class="text-xl text-gray-400 hover:text-black transition transform active:scale-90 p-2">⬅️</a>
            <h1 class="text-sm font-bold text-red-600 tracking-[0.2em] uppercase flex items-center gap-2">
                <span>🔥</span> OUTLET FIRSATLARI
            </h1>
            <div class="w-8"></div>
        </div>

        <div class="px-4 pb-3 space-y-3">
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="category-filters">
                <!-- Kategoriler -->
            </div>
            
            <select id="sort-select" onchange="setSort(this.value)" class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-xs font-bold rounded-lg p-2.5 focus:ring-red-500 focus:border-red-500 outline-none">
                <option value="newest">✨ En Yeniler</option>
                <option value="price_asc">💰 Fiyat: Düşükten Yükseğe</option>
                <option value="price_desc">💎 Fiyat: Yüksekten Düşüğe</option>
            </select>
        </div>
    </div>

    <!-- Boşluk -->
    <div class="h-40"></div>

    <!-- Ürün Grid Alanı -->
    <div id="product-list" class="product-grid px-3 md:px-6 pt-2 min-h-[50vh]">
        <!-- JS ile kartlar buraya basılacak -->
    </div>

    <!-- Loader -->
    <div id="loader-area" class="text-center py-8 pb-24">
        <div id="loading-spinner" class="hidden text-gray-400 text-sm animate-pulse">Yükleniyor...</div>
        <button id="load-more-btn" onclick="loadOutletItems()" class="hidden bg-white border border-gray-300 text-gray-600 px-6 py-3 rounded-full font-bold text-sm shadow-sm hover:bg-gray-50 active:scale-95 transition">
            Daha Fazla Göster 👇
        </button>
        <div id="end-message" class="hidden text-xs text-gray-400 uppercase tracking-widest mt-4">Tüm ürünler görüntülendi</div>
    </div>

    <!-- Detay Modal -->
    <div id="detail-modal" class="modal-backdrop" onclick="closeModal()">
        <div class="modal bg-white rounded-3xl overflow-hidden max-w-md w-full m-4 shadow-2xl relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-20 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur">✕</button>
            
            <div class="relative aspect-square bg-gray-50 flex items-center justify-center">
                <!-- Yükleniyor Spinner (Resim arkasında) -->
                <div class="absolute inset-0 flex items-center justify-center text-gray-300">
                    <svg class="animate-spin h-8 w-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
                
                <!-- Resim -->
                <img id="modal-img" src="" class="absolute inset-0 w-full h-full object-cover z-10">
                
                <div class="absolute top-4 left-4 bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg z-20">🔥 FIRSAT</div>
            </div>

            <div class="p-6 text-center">
                <h2 id="modal-title" class="text-2xl font-serif font-bold text-gray-900 mb-2"></h2>
                <p id="modal-category" class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4"></p>
                <div class="bg-orange-50 rounded-xl p-4 border border-orange-100 mb-4">
                    <div id="modal-price" class="text-3xl font-bold text-[#b45309] font-mono tracking-tighter"></div>
                    <div id="modal-gram" class="text-sm text-gray-500 font-bold mt-1"></div>
                </div>
                <p id="modal-desc" class="text-sm text-gray-600 leading-relaxed mb-6"></p>
                <button id="whatsapp-btn" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-green-700 transition flex items-center justify-center gap-2 active:scale-95">
                    <span>💬</span> WhatsApp ile İletişime Geç
                </button>
            </div>
        </div>
    </div>

<script>
    const SUPA_URL = "https://vbohhfiyrldqwosoukxx.supabase.co";
    const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZib2hoZml5cmxkcXdvc291a3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3MTQ1MTcsImV4cCI6MjA3OTI5MDUxN30.98w7JG6inltrNrW587Au1nSXsA5bKqhW3dBfUqbnNkg";
    const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

    let currentPage = 0;
    const ITEMS_PER_PAGE = 10;
    let isLoading = false;
    let hasMore = true;
    
    let currentCategory = 'Tümü';
    let currentSort = 'newest';

    const CATEGORIES = ['Tümü', 'Kolye', 'Bilezik', 'Bileklik', 'Yüzük', 'Küpe', 'Set', 'Saat', 'Diğer'];

    function initFilters() {
        const container = document.getElementById('category-filters');
        let html = '';
        CATEGORIES.forEach(cat => {
            const isActive = cat === currentCategory;
            const cls = isActive 
                ? "bg-red-600 text-white border-red-600 shadow-md" 
                : "bg-white text-gray-600 border-gray-200 hover:border-red-300";
            
            html += `<button onclick="setCategory('${cat}')" class="${cls} px-4 py-2 rounded-full text-xs font-bold border transition whitespace-nowrap active:scale-95">${cat}</button>`;
        });
        container.innerHTML = html;
    }

    function setCategory(cat) {
        if (currentCategory === cat) return;
        currentCategory = cat;
        resetAndLoad();
        initFilters();
    }

    function setSort(sortVal) {
        if (currentSort === sortVal) return;
        currentSort = sortVal;
        resetAndLoad();
    }

    function resetAndLoad() {
        currentPage = 0;
        hasMore = true;
        document.getElementById('product-list').innerHTML = '';
        document.getElementById('end-message').classList.add('hidden');
        document.getElementById('load-more-btn').classList.add('hidden');
        loadOutletItems();
    }

    const formatCurrency = (val) => {
        if (!val) return "";
        const cleanVal = val.toString().replace(/[^0-9]/g, '');
        if (!cleanVal) return "";
        return new Intl.NumberFormat('tr-TR').format(cleanVal) + ' ₺';
    };

    const getOptimizedImageUrl = (url, width = 300, quality = 60) => {
        if (!url || url.includes("placehold.co") || url.startsWith("blob:")) return url || "https://placehold.co/300x300?text=Resim+Yok";
        return `${url}?width=${width}&resize=cover&quality=${quality}&format=webp`;
    };

    async function loadOutletItems() {
        if (isLoading || !hasMore) return;
        
        isLoading = true;
        document.getElementById('loading-spinner').classList.remove('hidden');
        document.getElementById('load-more-btn').classList.add('hidden');

        const from = currentPage * ITEMS_PER_PAGE;
        const to = from + ITEMS_PER_PAGE - 1;

        let query = supa
            .from("vitrin")
            .select('id, baslik, fiyat, gram, resim, kategori, aciklama')
            .eq('etiket', 'Outlet');

        if (currentCategory !== 'Tümü') {
            query = query.eq('kategori', currentCategory);
        }

        if (currentSort === 'newest') {
            query = query.order('id', { ascending: false });
        } else if (currentSort === 'price_asc') {
            query = query.order('fiyat', { ascending: true });
        } else if (currentSort === 'price_desc') {
            query = query.order('fiyat', { ascending: false });
        }

        const { data, error } = await query.range(from, to);

        document.getElementById('loading-spinner').classList.add('hidden');
        isLoading = false;

        if (error) {
            console.error("Hata:", error);
            return;
        }

        const listEl = document.getElementById('product-list');

        if (!data || data.length === 0) {
            hasMore = false;
            if (currentPage === 0) {
                listEl.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-300">
                        <span class="text-4xl mb-4 opacity-30">🕸️</span>
                        <p class="font-serif italic text-sm text-center">Bu kriterde ürün bulunamadı.</p>
                        <button onclick="setCategory('Tümü')" class="mt-4 text-red-500 text-xs font-bold underline">Tümünü Göster</button>
                    </div>`;
            } else {
                document.getElementById('end-message').classList.remove('hidden');
            }
            return;
        }

        const fragment = document.createDocumentFragment();

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = "group bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden active:scale-95 transition-transform cursor-pointer relative flex flex-col";
            card.onclick = () => openModal(item);
            
            card.innerHTML = `
                <div class="relative aspect-[4/5] bg-gray-50 overflow-hidden">
                    <div class="absolute top-2 right-2 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow-sm z-10">FIRSAT</div>
                    <img src="${getOptimizedImageUrl(item.resim, 300, 60)}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" loading="lazy" decoding="async" alt="${item.baslik}" />
                </div>
                <div class="p-3 flex flex-col flex-1">
                    <div class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-0.5 truncate">${item.kategori || ''}</div>
                    <h2 class="font-serif text-sm text-gray-900 leading-tight mb-2 line-clamp-2 min-h-[2.5em]">${item.baslik}</h2>
                    
                    <div class="mt-auto flex items-center justify-between">
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-red-600 font-mono tracking-tighter">${formatCurrency(item.fiyat)}</span>
                        </div>
                        <div class="bg-green-50 text-green-700 text-[10px] font-bold px-2 py-1 rounded border border-green-100">
                            İNCELE
                        </div>
                    </div>
                </div>
            `;
            fragment.appendChild(card);
        });

        listEl.appendChild(fragment);
        currentPage++;
        
        if (data.length < ITEMS_PER_PAGE) {
            hasMore = false;
            document.getElementById('end-message').classList.remove('hidden');
        } else {
            document.getElementById('load-more-btn').classList.remove('hidden');
        }
    }

    function openModal(item) {
        const imgEl = document.getElementById('modal-img');
        
        // 1. Önceki resmi tamamen temizle ve gizle (Ghost image'ı engeller)
        imgEl.style.opacity = '0';
        imgEl.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

        document.getElementById('modal-title').textContent = item.baslik;
        document.getElementById('modal-category').textContent = item.kategori || '';
        document.getElementById('modal-price').textContent = formatCurrency(item.fiyat);
        document.getElementById('modal-gram').textContent = item.gram ? `⚖️ ${item.gram}` : '';
        document.getElementById('modal-desc').textContent = item.aciklama || '';
        
        const wpBtn = document.getElementById('whatsapp-btn');
        wpBtn.onclick = () => window.open(`https://wa.me/905382436870?text=Merhaba, şu ürün hakkında bilgi almak istiyorum: ${item.baslik}`, '_blank');

        document.getElementById('detail-modal').classList.add('active');

        // 2. Yeni resmi yükle ve yüklenince göster
        setTimeout(() => {
            const newSrc = getOptimizedImageUrl(item.resim, 900, 75);
            
            imgEl.onload = () => {
                imgEl.style.opacity = '1';
            };
            
            imgEl.src = newSrc;
        }, 50);
    }

    function closeModal() {
        document.getElementById('detail-modal').classList.remove('active');
    }

    initFilters();
    window.onload = loadOutletItems;

</script>
</body>
</html>
