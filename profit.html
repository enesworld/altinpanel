<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Kâr / Zarar Hesaplama</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #fafafa;
    }
  </style>
</head>

<body>
<div id="root" class="p-4"></div>

<script type="text/babel">

// Supabase kredilerini sen dolduracaksın
const SUPA_URL = "https://vbohhfiyrldqwosoukxx.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZib2hoZml5cmxkcXdvc291a3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3MTQ1MTcsImV4cCI6MjA3OTI5MDUxN30.98w7JG6inltrNrW587Au1nSXsA5bKqhW3dBfUqbnNkg";

const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

// Harem API
const API = "https://canlipiyasalar.haremaltin.com/tmp/altin.json?dil_kodu=tr";

// Güvenli fetch
async function safeFetch(url, timeout = 3500) {
  try {
    const controller = new AbortController();
    setTimeout(() => controller.abort(), timeout);

    const res = await fetch(url, { signal: controller.signal });
    const text = await res.text();
    return JSON.parse(text);

  } catch (err) {
    console.warn("Fetch error:", err);
    return null;
  }
}

function App() {
  const [policy, setPolicy] = React.useState(null);
  const [prices, setPrices] = React.useState({});
  const [loading, setLoading] = React.useState(true);

  // Form
  const [type, setType] = React.useState("22k");
  const [gram, setGram] = React.useState(1);
  const [buyPrice, setBuyPrice] = React.useState("");

  // Hesap
  const [profit, setProfit] = React.useState(null);

  // Politikayı çek
  React.useEffect(() => {
    async function loadPolicy() {
      const { data } = await supa.from("altin_politika").select("*").eq("id", 1).single();
      setPolicy(data);
    }
    loadPolicy();
  }, []);

  // API fiyatlarını çek
  React.useEffect(() => {
    if (!policy) return;

    async function load() {
      const j = await safeFetch(API);
      if (!j) return;

      const d = j.data;
      const p = policy;

      const raw22 = Number(d.AYAR22.alis);
      const raw24 = Number(d.ALTIN.alis);


      setPrices({
        g22: Math.round(raw22 + Number(p.gram22)),
        g24: Math.round(raw24 + Number(p.gram24))
      });

      setLoading(false);
    }

    load();
  }, [policy]);

  // Hesaplama
  function calculate() {
    let sale = 0;

    if (type === "22k") sale = prices.g22 * gram;
    if (type === "24k") sale = prices.g24 * gram;

    const diff = sale - Number(buyPrice);
    setProfit(diff);
  }

  return (
    <div className="max-w-lg mx-auto mt-10 bg-white p-6 rounded-xl shadow-lg">

      <h1 className="text-2xl font-bold text-center text-yellow-700 mb-4">
        Ne kadar kâr / zarar ettim?
      </h1>

      {loading ? (
        <div className="text-center text-gray-500">Fiyatlar yükleniyor...</div>
      ) : (
        <>

          <label className="block mb-2 font-medium">Ürün Ayarı</label>
          <select
            className="w-full p-2 border rounded mb-4"
            value={type}
            onChange={(e) => setType(e.target.value)}
          >
            <option value="22k">22 Ayar</option>
            <option value="24k">24 Ayar</option>
          </select>

          <label className="block mb-2 font-medium">Gram</label>
          <input
            type="number"
            className="w-full p-2 border rounded mb-4"
            value={gram}
            onChange={(e) => setGram(Number(e.target.value))}
          />

          <label className="block mb-2 font-medium">Bu Ürünü Kaça Aldın?</label>
          <input
            type="number"
            className="w-full p-2 border rounded mb-4"
            placeholder="Örn: 8500"
            value={buyPrice}
            onChange={(e) => setBuyPrice(e.target.value)}
          />

          <button
            onClick={calculate}
            className="w-full bg-yellow-600 text-white py-2 rounded-lg mt-3"
          >
            Hesapla
          </button>

          {profit !== null && (
  <div className="mt-6 text-center text-lg font-bold">

    {profit > 0 && (
      <>
        Şu anki kârın:{" "}
        <span className="text-green-600">
          {profit.toLocaleString("tr-TR")} TL
        </span>
      </>
    )}

    {profit < 0 && (
      <>
        Şu anki zararının:{" "}
        <span className="text-red-600">
          {(profit * -1).toLocaleString("tr-TR")} TL
        </span>
      </>
    )}

    {profit === 0 && (
      <>
        Şu anki durumun:{" "}
        <span className="text-gray-700">
          0 TL
        </span>
      </>
    )}

  </div>
)}


        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
