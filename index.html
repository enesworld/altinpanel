// ======================================================
// SAFE FETCH – Timeout + Retry + Güvenli JSON
// ======================================================
async function safeFetch(url, timeout = 3500, retries = 2) {
  for (let i = 0; i <= retries; i++) {
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);

      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);

      if (!res.ok) throw new Error("HTTP Error: " + res.status);

      const text = await res.text();
      if (!text || text.trim() === "") throw new Error("Boş yanıt");

      let json;
      try {
        json = JSON.parse(text);
      } catch {
        throw new Error("JSON Parse Error");
      }

      if (!json.data) throw new Error("Geçersiz veri formatı");

      return json;

    } catch (err) {
      console.warn(`safeFetch attempt ${i + 1} failed => ${err.message}`);
      if (i === retries) return null;
      await new Promise(r => setTimeout(r, 500)); // retry cooldown
    }
  }
}

function fp(v) {
  return v?.toLocaleString("tr-TR") ?? "-";
}
function ft(t) {
  return t
    ? t.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })
    : "-";
}
function diff(c, p) {
  const d = c - p;
  const pct = (d / p) * 100;
  const s = d > 0 ? "+" : "";
  return `${s}${d.toFixed(2)} ₺ / ${s}${pct.toFixed(2)}%`;
}

// 3. Component: AnimatedValue

const AnimatedValue = React.memo(({ value, prev, showDiff = true }) => {
  if (value == null || isNaN(value)) return <span>-</span>;

  // ANİMASYON SINIFI
  let cls = "text-xl font-bold transition-all duration-300 text-center";

  // SADECE FİYAT DEĞİŞİNCE ANİMASYON
  if (prev !== null && prev !== undefined && value !== prev) {
    if (value > prev) cls = "flash-up";
    else cls = "flash-down";
  }

  return (
    <div className="flex flex-col items-center leading-tight">

      {/* GPU HIZLANDIRMALI FİYAT */}
      <span
        className={cls}
        style={{ willChange: "transform, color" }}
      >
        {fp(Math.round(value))}{" "}
        <span className="text-xs text-yellow-700">₺</span>
      </span>

      {/* FARK GÖSTERGESİ */}
      {showDiff && prev != null && prev !== undefined && (
        <span className="text-[11px] text-gray-500 mt-0.5">
          {diff(value, prev)}
        </span>
      )}
    </div>
  );
});

          </a>
        </div>

        {/* Başlık ve Tarih */}
        <h1 className="text-4xl font-serif font-bold text-center text-yellow-800 mb-4 z-10 drop-shadow-sm">
          Bakırköy Kuyumcusu
        </h1>
        <div className="text-center text-xs text-yellow-700 font-bold tracking-widest uppercase mb-6 opacity-80 z-10">
          {new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })} • Canlı Piyasa
        </div>

        {/* Fiyat Kartı (Cam Efekti) */}
        <div className="bg-white/90 backdrop-blur-sm p-6 rounded-2xl shadow-xl border border-yellow-100 z-10">
          
          <Row title="Çeyrek Altın" buy={prices.qBuy} sell={prices.qSell} prevBuy={prevPrices.qBuy} prevSell={prevPrices.qSell} />
          
          <Row title="Ata Altın" buy={prices.aBuy} sell={prices.aSell} prevBuy={prevPrices.aBuy} prevSell={prevPrices.aSell} />
          
          <div className="grid grid-cols-2 gap-4 mt-6">
            <Box title="22 Ayar Gram" value={prices.g22} prev={prevPrices.g22} />
            <Box title="24 Ayar Gram" value={prices.g24} prev={prevPrices.g24} />
          </div>

          <div className="grid grid-cols-3 gap-3 mt-4">
            <SmallBox title="0.25g (24K)" value={prices.s025} prev={prevPrices.s025} />
            <SmallBox title="0.50g (22K)" value={prices.s0522} prev={prevPrices.s0522} />
            <SmallBox title="0.50g (24K)" value={prices.s0524} prev={prevPrices.s0524} />
          </div>

          {/* Kartın Altındaki Bilgi */}
          <div className="mt-5 pt-3 border-t border-gray-200 flex justify-between items-center text-[10px] text-gray-500 font-mono uppercase">
             <span>Saat: {ft(lastUpdate)}</span>
             <span className="font-bold tracking-wider">@bakirkoykuyumcusu</span>
          </div>
        </div>
        
        {/* Slogan */}
        <div className="mt-6 text-center text-yellow-800/60 font-serif italic text-sm z-10">
          "Güvenin ve Kalitenin Adresi"
        </div>

      </div> 
      {/* --- 📸 FOTOĞRAF ALANI BİTİŞ --- */}


      {/* Sabitlik Uyarısı (Fotoğrafta çıkmasın diye dışarı aldım) */}
      {isStable && (
        <div className="mt-4 text-center text-xs text-gray-500 animate-pulse">
          ⚠️ Veri akışı şu an sabit (Piyasa kapalı olabilir)
        </div>
      )}

      {/* --- MODALLAR --- */}
      {loginOpen && (
        <LoginModal
          onClose={() => setLoginOpen(false)}
          onLoginSuccess={(u) => {
            setUser(u);
            setLoginOpen(false);
            setAdminOpen(true);
          }}
        />
      )}

      {adminOpen && draft && (
        <AdminModal
          open={adminOpen}
          draft={draft}
          setDraft={setDraft}
          backupPolicy={backupPolicy}
          setBackupPolicy={setBackupPolicy}
          onClose={() => setAdminOpen(false)}
          onSave={async () => {
            await supa.from("altin_politika").update(draft).eq("id", 1);
            setPolicy({ ...draft });
            setAdminOpen(false);
            setBackupPolicy(null);
          }}
        />
      )}

    </div>

</script>
