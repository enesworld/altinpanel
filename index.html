  // ======================================================
// SAFE FETCH – Timeout + Retry + Güvenli JSON
// ======================================================
async function safeFetch(url, timeout = 3500, retries = 2) {
  for (let i = 0; i <= retries; i++) {
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);

      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);

      if (!res.ok) throw new Error("HTTP Error: " + res.status);

      const text = await res.text();
      if (!text || text.trim() === "") throw new Error("Boş yanıt");

      let json;
      try {
        json = JSON.parse(text);
      } catch {
        throw new Error("JSON Parse Error");
      }

      if (!json.data) throw new Error("Geçersiz veri formatı");

      return json;

    } catch (err) {
      console.warn(`safeFetch attempt ${i + 1} failed => ${err.message}`);
      if (i === retries) return null;
      await new Promise(r => setTimeout(r, 500)); // retry cooldown
    }
  }
}

// =========================================================
// 2. Yardımcı Fonksiyonlar

function fp(v) {
  return v?.toLocaleString("tr-TR") ?? "-";
}
function ft(t) {
  return t
    ? t.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })
    : "-";
}
function diff(c, p) {
  const d = c - p;
  const pct = (d / p) * 100;
  const s = d > 0 ? "+" : "";
  return `${s}${d.toFixed(2)} ₺ / ${s}${pct.toFixed(2)}%`;
}


// =========================================================
// 3. Component: AnimatedValue
// =========================================================

const AnimatedValue = React.memo(({ value, prev, showDiff = true }) => {
  if (value == null || isNaN(value)) return <span>-</span>;

  // ANİMASYON SINIFI
  let cls = "text-xl font-bold transition-all duration-300 text-center";

  // SADECE FİYAT DEĞİŞİNCE ANİMASYON
  if (prev !== null && prev !== undefined && value !== prev) {
    if (value > prev) cls = "flash-up";
    else cls = "flash-down";
  }

  return (
    <div className="flex flex-col items-center leading-tight">

      {/* GPU HIZLANDIRMALI FİYAT */}
      <span
        className={cls}
        style={{ willChange: "transform, color" }}
      >
        {fp(Math.round(value))}{" "}
        <span className="text-xs text-yellow-700">₺</span>
      </span>

      {/* FARK GÖSTERGESİ */}
      {showDiff && prev != null && prev !== undefined && (
        <span className="text-[11px] text-gray-500 mt-0.5">
          {diff(value, prev)}
        </span>
      )}
    </div>
  );
});

      email,
      password,

    if (error) {
      setError(error.message);
      return;
    }

    onLoginSuccess(data.user);
  }

  return (
    <div className="modal-backdrop">
      <div className="modal">
        <h3 className="text-lg font-semibold mb-4 text-yellow-700">
          Yönetici Girişi

            className="px-3 py-2 mr-2 border rounded"
            onClick={onClose}
          >
            Kapat

          <button
            className="px-3 py-2 rounded bg-yellow-600 text-white"
            onClick={login}
          >
            Giriş Yap
          </button>
        </div>
      </div>
    </div>
  );
}

// =========================================================
// 9. ANA UYGULAMA (APP)
// =========================================================

function App() {
  const [prices, setPrices] = React.useState({});
  const [prevPrices, setPrevPrices] = React.useState({});
  const [lastUpdate, setLastUpdate] = React.useState(null);
  const [countdown, setCountdown] = React.useState(3);

  const [user, setUser] = React.useState(null);
  const [loginOpen, setLoginOpen] = React.useState(false);

  const [policy, setPolicy] = React.useState(null);
  const [draft, setDraft] = React.useState(null);
  const [adminOpen, setAdminOpen] = React.useState(false);

  const [backupPolicy, setBackupPolicy] = React.useState(null);

  // 📌 STABILITE STATE'LERI BURAYA
  const [stabilitySeconds, setStabilitySeconds] = React.useState(0);
  const [isStable, setIsStable] = React.useState(false);

  // Sayaç
  React.useEffect(() => {
  setCountdown(10); // başlangıç — 10 saniye

  const t = setInterval(() => {
    setCountdown((c) => (c <= 1 ? 10 : c - 1));
  }, 1000);

  return () => clearInterval(t);
}, []);

  // Politikayı getir
  React.useEffect(() => {
    async function load() {
      const { data } = await supa
        .from("altin_politika")
        .select("*")
        .eq("id", 1)
        .single();
      setPolicy(data);
      setDraft(data);
    }
    load();
  }, []);

  // Stabilite sayacı → her saniye 1 artar
React.useEffect(() => {
  const t = setInterval(() => {
    setStabilitySeconds((s) => s + 1);
  }, 1000);

  return () => clearInterval(t);
}, []);

// 30 saniye boyunca fiyat değişmezse sabitlik modu aktif
React.useEffect(() => {
  if (stabilitySeconds >= 30) {
    setIsStable(true);
  }
}, [stabilitySeconds]);



// FİYATLARI ÇEKEN EFEKT
React.useEffect(() => {
  if (!policy) return;

  // Her seferinde güvenli sayı çeviricisi
  const num = (v) => Number(v) || 0;

  // ANA LOAD FONKSİYONU
  async function load() {
    try {
      // SAFE FETCH → API verisini çek
      const j = await safeFetch(API);

      if (!j) {
        console.warn("API erişilemedi. En son fiyatlar korunuyor.");
        return; // panel donmaz, boş fiyat yazmaz
      }

      const d = j.data;
      const P = policy;

      // Ham fiyatları güvenli sayıya çevir
      const rawQuarterBuy  = num(d.CEYREK_ESKI.alis);
      const rawQuarterSell = num(d.CEYREK_ESKI.satis);
      const rawAtaBuy      = num(d.ATA_ESKI.alis);
      const rawAtaSell     = num(d.ATA_ESKI.satis);
      const rawG22Sell     = num(d.AYAR22.satis);
      const rawG24Sell     = num(d.ALTIN.satis);

      // Politika makasları
      const mkCeyrekAlis   = num(P.ceyrek_alis);
      const mkCeyrekSatis  = num(P.ceyrek_satis);
      const mkAtaAlis      = num(P.ata_alis);
      const mkAtaSatis     = num(P.ata_satis);
      const mkG22          = num(P.gram22);
      const mkG24          = num(P.gram24);

      const carp025        = num(P.g025);
      const carp05_22      = num(P.g05_22);
      const carp05_24      = num(P.g05_24);

      // Makas eklenmiş tam sayılar
      const qBuy  = Math.round(rawQuarterBuy  + mkCeyrekAlis);
      const qSell = Math.round(rawQuarterSell + mkCeyrekSatis);
      const aBuy  = Math.round(rawAtaBuy      + mkAtaAlis);
      const aSell = Math.round(rawAtaSell     + mkAtaSatis);

      const g22 = Math.round(rawG22Sell + mkG22);
      const g24 = Math.round(rawG24Sell + mkG24);

      // Küçük gramlar (makaslı gram üzerinden)
      const s025  = Math.round(g24 * carp025);
      const s0522 = Math.round(g22 * carp05_22);
      const s0524 = Math.round(g24 * carp05_24);

      const newPrices = {
        qBuy, qSell,
        aBuy, aSell,
        g22, g24,
        s025, s0522, s0524
      };

      setPrices((prev) => {
  // İlk çalışmada prev boş olabilir
  const previous = prev || {};

  // Fiyat değişti mi?
  const changed = JSON.stringify(previous) !== JSON.stringify(newPrices);

  // Eğer değiştiyse stabilite sıfırla
  if (changed) {
    setStabilitySeconds(0);
    setIsStable(false);
  }

  // Yeni previous değerini kaydet
  setPrevPrices(newPrices);

  return newPrices;
});


      setLastUpdate(new Date());
    } catch (e) {
      console.error("load() hata:", e);
    }
  }

  // ======================================================
  // NON-BLOCKING FETCH LOOP → UI donmaz, çakışma yok
  // ======================================================
  async function tickLoop() {
    await load();
    setTimeout(tickLoop, 10000);
  }

  tickLoop(); // döngüyü başlat

}, [policy]);


  return (
    <div className="w-full max-w-2xl mx-auto px-4 pt-12 pb-10">
	<button
  className="fixed top-4 right-16 text-2xl text-gray-600 hover:text-black"
  onClick={() => window.open('ham.html', '_blank')}
  title="Ham Fiyatlar"
>
  📜
</button>


      {/* Ayar ikonu */}
      <button
        className="fixed top-4 right-4 text-2xl text-gray-600 hover:text-black"
        onClick={() => (user ? setAdminOpen(true) : setLoginOpen(true))}
      >
        ⚙
      </button>

      <button
  class="fixed top-4 right-28 text-2xl text-gray-600 hover:text-black"
  onClick={() => window.open('profit.html', '_blank')}
  title="Kâr / Zarar Hesaplama"
>
  📟
</button>


      {/* Çıkış */}
      {user && (
        <button
          className="fixed top-4 left-4 text-sm text-red-600"
          onClick={async () => {
            await supa.auth.signOut();
            setUser(null);
          }}
        >
          Çıkış Yap
        </button>
      )}

      {/* Logo */}
      <div className="flex justify-center mb-6">
        <img
          src="bk.jpeg"
          className="h-28 w-28 rounded-xl shadow-lg"
          alt="logo"
        />
      </div>

      {/* Başlık */}
      <h1 className="text-4xl font-serif font-bold text-center text-yellow-700 mb-1">
        Bakırköy Kuyumcusu
      </h1>

      <div className="text-center text-sm text-gray-500 mb-6">
        Güncelleme: {ft(lastUpdate)} • {countdown}s
      </div>

      {/* Ana Kart */}
      <div className="bg-white p-6 rounded-2xl shadow-xl border">

        <Row
          title="Çeyrek Altın"
          buy={prices.qBuy}
          sell={prices.qSell}
          prevBuy={prevPrices.qBuy}
          prevSell={prevPrices.qSell}
        />

        <Row
          title="Ata Altın"
          buy={prices.aBuy}
          sell={prices.aSell}
          prevBuy={prevPrices.aBuy}
          prevSell={prevPrices.aSell}
        />

        <div className="grid grid-cols-2 gap-4 mt-6">
          <Box title="22 Ayar Gram" value={prices.g22} prev={prevPrices.g22} />
          <Box title="24 Ayar Gram" value={prices.g24} prev={prevPrices.g24} />
        </div>

        <div className="grid grid-cols-3 gap-3 mt-4">
          <SmallBox title="0.25g (24K)" value={prices.s025} prev={prevPrices.s025} />
          <SmallBox title="0.50g (22K)" value={prices.s0522} prev={prevPrices.s0522} />
          <SmallBox title="0.50g (24K)" value={prices.s0524} prev={prevPrices.s0524} />
        </div>
      </div>
{/* ← BURAYA SABİTLİK MESAJINI EKLİYORSUN */}
{isStable && (
  <div className="mt-4 text-center text-xs text-gray-500">
    Veri akışı sabit seyrediyor
  </div>
)}
      {/* Login */}
      {loginOpen && (
        <LoginModal
          onClose={() => setLoginOpen(false)}
          onLoginSuccess={(u) => {
            setUser(u);
            setLoginOpen(false);
            setAdminOpen(true);
          }}
        />
      )}

      {/* Admin Panel */}
      {adminOpen && draft && (
  <AdminModal
    open={adminOpen}
    draft={draft}
    setDraft={setDraft}
    backupPolicy={backupPolicy}
    setBackupPolicy={setBackupPolicy}
    onClose={() => setAdminOpen(false)}
    onSave={async () => {
      await supa.from("altin_politika").update(draft).eq("id", 1);
      setPolicy({ ...draft });
      setAdminOpen(false);
      setBackupPolicy(null); // makası azaltınca eski kayıt silinsin
    }}
  />
)}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
