  <!-- Kopyalama Fonksiyonu (Buton Üzerinde Bildirim) -->
  <script>
    function copyToClipboard(text, btnElement) {
      // Butonun orijinal içeriğini sakla
      const originalContent = btnElement.innerHTML;
      const originalClass = btnElement.className;

      const onSuccess = () => {
        // Buton içeriğini ve stilini değiştir (Yeşil ve Onay İkonu)
        btnElement.innerHTML = '✅ Kopyalandı';
        btnElement.className = "text-[10px] font-bold bg-green-100 text-green-700 px-3 py-1.5 rounded-full transition flex items-center gap-1 cursor-default uppercase tracking-wide border border-green-200";
        
        // 2 saniye sonra eski haline döndür
        setTimeout(() => {
          btnElement.innerHTML = originalContent;
          btnElement.className = originalClass;
        }, 2000);
      };

      // Modern API
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(err => {
          console.warn('Modern kopyalama başarısız, yedek yöntem deneniyor...', err);
          fallbackCopy(text, onSuccess);
        });
      } else {
        fallbackCopy(text, onSuccess);
      }
    }

    // Yedek Kopyalama Yöntemi
    function fallbackCopy(text, onSuccess) {
      try {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        
        if (successful) onSuccess();
      } catch (err) {
        console.error('Tüm kopyalama yöntemleri başarısız:', err);
        alert("Kopyalama yapılamadı. Lütfen metni elle seçip kopyalayın.");
      }
    }
  </script>
