const formatCurrency = (val) => {
    if (!val) return "";

    return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(cleanVal);

const getOptimizedImageUrl = (url, width = 500) => {

const AnimatedValue = React.memo(({ value, prev }) => {
  if (value === undefined || value === null || isNaN(value) || value === 0) {
    return <div className="text-xl text-gray-300 font-bold">...</div>;
  }
  let cls = "text-xl font-bold tracking-tight transition-all duration-500";
  if (prev && value !== prev) cls = value > prev ? "flash-up" : "flash-down";
  return (
    <div className={cls}>
      {fp(Math.round(value))} <span className="text-sm font-normal text-gray-400">₺</span>
    </div>
  );
});

    if (selectedFilter) {
      if (filterType === 'category') result = result.filter(i => i.kategori === selectedFilter);
      if (filterType === 'tag') result = result.filter(i => i.etiket === selectedFilter);
    }
    if (priceRange !== 'all') {
      result = result.filter(item => {
         const cleanPrice = item.fiyat ? parseInt(item.fiyat.toString().replace(/\./g, '').replace(/[^0-9]/g, '')) : 0;
         if (priceRange === 'low') return cleanPrice <= 5000;
         if (priceRange === 'mid') return cleanPrice > 5000 && cleanPrice <= 15000;
         if (priceRange === 'high') return cleanPrice > 15000 && cleanPrice <= 30000;
         if (priceRange === 'premium') return cleanPrice > 30000;
         return true;
      });
    }
    return result;
  }, [items, selectedFilter, filterType, priceRange]);

  React.useEffect(() => {
    setPage(1);
  }, [selectedFilter, priceRange]);

  const paginatedItems = filteredItems.slice((page - 1) * ITEMS_PER_PAGE, page * ITEMS_PER_PAGE);
  const totalPages = Math.ceil(filteredItems.length / ITEMS_PER_PAGE);

  if (step === 0) {
    return (
      <div key="step0" className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-[#b45309] via-[#d97706] to-[#92400e] p-6 fade-in text-center relative overflow-hidden">
         <button onClick={onBack} className="absolute top-6 left-6 text-2xl bg-white/20 backdrop-blur p-3 rounded-full text-white hover:bg-white/40 transition shadow-lg active:scale-90">⬅️</button>
         <h2 className="text-3xl font-serif font-bold text-white mb-10 drop-shadow-lg">Size Nasıl Yardımcı Olalım?</h2>
         <div className="grid gap-6 w-full max-w-md">
            <button onClick={() => { setFilterType('tag'); setStep(1); }} className="bg-white/10 backdrop-blur-xl border border-white/40 text-white p-6 rounded-3xl shadow-xl flex items-center justify-between hover:bg-white/20 transition transform active:scale-95">
              <span className="text-left"><span className="block text-xl font-bold mb-1">🎁 Ne İçin Bakıyorsunuz?</span><span className="text-xs text-yellow-100/80 font-medium tracking-wide">Hediye, Özel Gün, Yatırım...</span></span><span className="text-3xl opacity-80">👉</span>
            </button>
            <button onClick={() => { setFilterType('category'); setStep(1); }} className="bg-white/10 backdrop-blur-xl border border-white/40 text-white p-6 rounded-3xl shadow-xl flex items-center justify-between hover:bg-white/20 transition transform active:scale-95">
              <span className="text-left"><span className="block text-xl font-bold mb-1">💍 Ne Tür Bakıyorsunuz?</span><span className="text-xs text-yellow-100/80 font-medium tracking-wide">Kolye, Bilezik, Yüzük...</span></span><span className="text-3xl opacity-80">👉</span>
            </button>
            <button onClick={() => { setFilterType(null); setSelectedFilter(null); setStep(2); }} className="mt-4 text-white/60 text-xs font-bold uppercase tracking-widest hover:text-white transition underline p-2">Tüm Koleksiyonu Göster</button>
         </div>
      </div>
    );
  }

  if (step === 1) {
    const options = filterType === 'tag' 
      ? ["Kendim İçin", "Yılbaşı", "Sevgililer Günü", "Anneler Günü", "Düğün/Nişan", "Doğum Günü", "İçimden Geldi", "Diğer"]
      : ["Kolye", "Bilezik", "Bileklik", "Yüzük", "Küpe", "Set", "Saat", "Diğer"];
    const title = filterType === 'tag' ? "Hangi Özel Gün?" : "Hangi Kategori?";
    return (
      <div key="step1" className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-[#b45309] via-[#d97706] to-[#92400e] p-6 fade-in relative overflow-hidden">
        <div className="absolute top-0 left-0 w-full p-6 flex items-center"><button onClick={() => setStep(0)} className="text-2xl bg-white/20 backdrop-blur p-3 rounded-full text-white hover:bg-white/40 transition shadow-lg active:scale-90">⬅️</button></div>
        <h2 className="text-3xl font-serif font-bold text-white mb-8 drop-shadow-lg text-center">{title}</h2>
        <div className="bg-white/95 backdrop-blur-xl rounded-[2rem] shadow-2xl p-6 w-full max-w-lg border border-white/50">
            <div className="grid grid-cols-2 gap-3">
              {options.map(opt => (
                <button key={opt} onClick={() => { setSelectedFilter(opt); setStep(2); }} className={`border border-gray-200 p-4 rounded-xl shadow-sm font-bold text-sm hover:shadow-md transition active:scale-95 ${opt === "Kendim İçin" ? "bg-red-600/90 text-white hover:bg-red-700 border-red-500 ring-2 ring-red-200" : "bg-gray-50 text-gray-700 hover:bg-[#b45309] hover:text-white hover:border-[#b45309]"}`}>{opt}</button>
              ))}
            </div>
        </div>
      </div>
    );
  }

  return (
    <>
    <div key="step2" className="min-h-screen bg-[#fdfcf8] flex flex-col animate-soft-enter relative">
       <div className="p-4 md:p-6 sticky top-0 z-50 bg-[#fdfcf8]/95 backdrop-blur-sm border-b border-gray-100">
          <div className="flex items-center justify-between mb-4">
             <button onClick={() => setStep(0)} className="text-xl text-gray-400 hover:text-black transition transform active:scale-90 p-2">✕</button>
             <h1 className="text-xs font-bold text-gray-400 tracking-[0.3em] uppercase">{selectedFilter || "Tüm Koleksiyon"}</h1>
             <div className="w-5"></div>
          </div>
          <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
             {[{ label: 'Tümü', val: 'all' }, { label: '0-5 Bin ₺', val: 'low' }, { label: '5-15 Bin ₺', val: 'mid' }, { label: '15-30 Bin ₺', val: 'high' }, { label: '30 Bin+ ₺', val: 'premium' }].map(f => (
               <button key={f.val} onClick={() => setPriceRange(f.val)} className={`px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider whitespace-nowrap transition ${priceRange === f.val ? 'bg-[#b45309] text-white shadow-md' : 'bg-white border border-gray-200 text-gray-500 hover:border-[#b45309] hover:text-[#b45309]'}`}>{f.label}</button>
             ))}
          </div>
       </div>
       <div className="flex flex-col pb-24 px-4 md:px-6 pt-2">
          {paginatedItems.map((urun, index) => (
             <div key={urun.id} onClick={() => setSelectedProduct(urun)} className="product-card group bg-white mb-8 rounded-[2rem] shadow-[0_5px_30px_-10px_rgba(0,0,0,0.05)] overflow-hidden border border-gray-50 active:scale-[0.99] transition-transform cursor-pointer">
                <div className="pt-8 pb-2 flex justify-center">
                    <div className="w-48 h-48 relative rounded-full bg-[#faf9f6] overflow-hidden shadow-inner border border-white ring-1 ring-gray-100">
                       <img src={getOptimizedImageUrl(urun.resim)} className="w-full h-full object-cover hover:scale-110 transition duration-700 ease-in-out" alt={urun.baslik} loading="lazy" />
                    </div>
                </div>
                <div className="p-6 text-center">
                    <div className="text-[9px] font-bold text-yellow-600 uppercase tracking-widest mb-2">{urun.kategori || 'ÖZEL'} PARÇA</div>
                    <h2 className="font-serif text-xl text-gray-900 mb-2 leading-tight">{urun.baslik}</h2>
                    <div className="flex flex-col gap-2 items-center">
                        <span className="text-lg font-medium text-gray-900 font-mono tracking-tighter">{formatCurrency(urun.fiyat)}</span>
                        {urun.gram && <span className="text-[10px] text-gray-500 font-mono">⚖️ {urun.gram}</span>}
                    </div>
                </div>
             </div>
          ))}

          {totalPages > 1 && (
            <div className="flex justify-center items-center gap-4 py-6">
                <button 
                    disabled={page === 1} 
                    onClick={() => setPage(p => Math.max(1, p - 1))}
                    className="bg-white border border-gray-200 px-4 py-2 rounded-full text-sm font-bold disabled:opacity-30 active:scale-95"
                >
                    ⬅️ Önceki
                </button>
                <span className="text-xs font-bold text-gray-400">{page} / {totalPages}</span>
                <button 
                    disabled={page === totalPages} 
                    onClick={() => setPage(p => Math.min(totalPages, p + 1))}
                    className="bg-white border border-gray-200 px-4 py-2 rounded-full text-sm font-bold disabled:opacity-30 active:scale-95"
                >
                    Sonraki ➡️
                </button>
            </div>
          )}

          {filteredItems.length === 0 && (
            <div className="flex flex-col items-center justify-center py-32 text-gray-300">
                <span className="text-4xl mb-4 opacity-20">🏷️</span>
                <p className="font-serif italic text-sm">Bu kriterlere uygun ürün yok.</p>
                <button onClick={() => setPriceRange('all')} className="mt-4 text-[#b45309] text-xs font-bold underline p-2">Filtreyi Temizle</button>
            </div>
          )}
       </div>
    </div>
    <ProductDetailModal product={selectedProduct} onClose={() => setSelectedProduct(null)} />
    </>
  );
});

// Login Modal (Eksik olan bileşen eklendi)
function LoginModal({ onClose, onLoginSuccess }) {
  const [email, setEmail] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [error, setError] = React.useState("");
  const handleSubmit = (e) => { e.preventDefault(); login(); };
  async function login() {
    const { data, error } = await supa.auth.signInWithPassword({ email, password });
    if (error) setError("Hatalı giriş!"); else onLoginSuccess(data.user);
  }
  return (
    <div className="modal-backdrop">
      <div className="modal p-8 bg-gradient-to-br from-yellow-900/90 to-amber-800/90 backdrop-blur-xl border border-yellow-500/30 shadow-2xl rounded-3xl w-full max-w-sm relative overflow-hidden">
        <h3 className="text-2xl font-serif font-bold text-white mb-6 text-center">Yönetici Girişi</h3>
        <form onSubmit={handleSubmit} className="flex flex-col gap-4">
          <input className="w-full p-3 rounded-xl bg-black/20 text-white" type="email" placeholder="E-posta Adresi" value={email} onChange={e=>setEmail(e.target.value)} />
          <input className="w-full p-3 rounded-xl bg-black/20 text-white" type="password" placeholder="Şifre" value={password} onChange={e=>setPassword(e.target.value)} />
          {error && <div className="text-red-300 text-xs font-bold text-center">{error}</div>}
          <div className="flex gap-3 mt-2">
            <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl text-white/60">Vazgeç</button>
            <button type="submit" className="flex-1 py-3 rounded-xl bg-yellow-600 text-white font-bold shadow-lg">Giriş Yap</button>
          </div>
        </form>
      </div>
    </div>
  );
}

// Customer Modal (Eksik olan bileşen eklendi)
const availableTags = ["VIP", "Pazarlıkçı", "Sık Gelen", "Yeni", "Sorunlu", "Referanslı", "Yatırımcı"];

function CustomerModal({ onClose, customers, fetchCustomers, fetchReminders, currentUser }) {
  const [mode, setMode] = React.useState('list');
  const [search, setSearch] = React.useState("");
  const [selectedCust, setSelectedCust] = React.useState(null);
  const [activeTab, setActiveTab] = React.useState('info');
  
  const [visits, setVisits] = React.useState([]);
  const [reminders, setReminders] = React.useState([]);
  const [loadingDetails, setLoadingDetails] = React.useState(false);

  const [formData, setFormData] = React.useState({});
  const [newVisit, setNewVisit] = React.useState({ product_type: '', amount: '', description: '', notes: '' });
  const [newReminder, setNewReminder] = React.useState({ title: '', due_at: '', description: '' });

  const filtered = React.useMemo(() => {
    const s = search.toLowerCase();
    return customers.filter(c => 
      c.full_name?.toLowerCase().includes(s) || 
      c.phone?.includes(s) ||
      (c.tags && c.tags.some(t => t.toLowerCase().includes(s)))
    );
  }, [customers, search]);

  async function fetchDetails(id) {
     setLoadingDetails(true);
     const v = await supa.from('customer_visits').select('*').eq('customer_id', id).order('visit_date', { ascending: false });
     if(v.data) setVisits(v.data);
     
     const r = await supa.from('customer_reminders').select('*').eq('customer_id', id).order('due_at', { ascending: true });
     if(r.data) setReminders(r.data);
     setLoadingDetails(false);
  }

  const handleSaveCustomer = async () => {
      if(!formData.full_name) return alert("İsim zorunlu");
      
      let error;
      if (formData.id) {
         const { id, ...rest } = formData;
         const res = await supa.from('customers').update(rest).eq('id', id);
         error = res.error;
      } else {
         const payload = { ...formData, user_id: currentUser?.id || null };
         const res = await supa.from('customers').insert(payload);
         error = res.error;
      }

      if(error) return alert("Hata: " + error.message);
      
      setFormData({});
      setMode('list');
      if(formData.id) setSelectedCust(formData);
      fetchCustomers();
  };

  const handleEditClick = () => {
      setFormData(selectedCust);
      setMode('add');
  };

  const handleDeleteClick = async () => {
      if(!confirm("DİKKAT! Bu müşteri ve tüm verileri kalıcı olarak silinecek. Emin misiniz?")) return;
      
      setLoadingDetails(true); 
      // İlişkili kayıtları temizle (Cascade yoksa diye)
      await supa.from('customer_visits').delete().eq('customer_id', selectedCust.id);
      await supa.from('customer_reminders').delete().eq('customer_id', selectedCust.id);
      const { error } = await supa.from('customers').delete().eq('id', selectedCust.id);
      
      setLoadingDetails(false);

      if(error) {
          alert("Silinemedi! Hata detayı: " + error.message);
      } else {
          alert("Müşteri başarıyla silindi.");
          setSelectedCust(null);
          setMode('list');
          fetchCustomers();
          fetchReminders();
      }
  };

  const toggleTag = (tag) => {
      const currentTags = formData.tags || [];
      if (currentTags.includes(tag)) {
          setFormData({ ...formData, tags: currentTags.filter(t => t !== tag) });
      } else {
          setFormData({ ...formData, tags: [...currentTags, tag] });
      }
  };

  const handleAddVisit = async () => {
     if(!selectedCust) return;
     const { error } = await supa.from('customer_visits').insert({ ...newVisit, customer_id: selectedCust.id });
     if(!error) { setNewVisit({ product_type: '', amount: '', description: '', notes: '' }); fetchDetails(selectedCust.id); }
  };

  const handleAddReminder = async () => {
     if(!selectedCust || !newReminder.title || !newReminder.due_at) return alert("Başlık ve Tarih girin");
     const { error } = await supa.from('customer_reminders').insert({ ...newReminder, customer_id: selectedCust.id });
     if(!error) { 
        setNewReminder({ title: '', due_at: '', description: '' }); 
        fetchDetails(selectedCust.id); 
        fetchReminders(); 
     }
  };

  const handleUpdateReminder = async (id, status) => {
     await supa.from('customer_reminders').update({ status }).eq('id', id);
     fetchDetails(selectedCust.id);
     fetchReminders(); 
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal modal-wide flex flex-row overflow-hidden bg-gray-50" onClick={e=>e.stopPropagation()}>
         
         {/* SOL KOLON: LİSTE */}
         <div className={`flex-1 flex flex-col border-r border-gray-200 bg-white ${selectedCust ? 'hidden md:flex' : 'flex'}`}>
            <div className="p-3 border-b flex items-center justify-between bg-gray-50">
               <h2 className="font-bold text-gray-700">Müşteriler</h2>
               <button onClick={()=>{setFormData({}); setMode('add');}} className="bg-green-100 text-green-700 px-3 py-1 rounded-lg text-xs font-bold hover:bg-green-200">+ Yeni</button>
            </div>
            <div className="p-2 border-b">
               <input autoFocus placeholder="🔍 İsim veya Etiket..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full bg-gray-100 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-yellow-400" />
            </div>
            
            {/* YENİ / DÜZENLEME FORMU */}
            {mode === 'add' ? (
                <div className="p-4 overflow-y-auto flex-1 bg-yellow-50/30">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="font-bold text-sm">{formData.id ? 'Düzenle' : 'Yeni Kayıt'}</h3>
                        <button onClick={()=>{setMode('list'); setFormData({});}} className="text-gray-400 text-xs">İptal</button>
                    </div>
                    <div className="space-y-3">
                        <input className="w-full p-2 border rounded text-sm" placeholder="Ad Soyad *" value={formData.full_name || ''} onChange={e=>setFormData({...formData, full_name:e.target.value})} />

function AdminModal({ open, draft, setDraft, vitrinItems, refreshVitrin, onClose, onSave }) {
  if (!open) return null;
  if (!draft) return <div className="modal-backdrop"><div className="modal p-6 text-center">Veriler Yükleniyor...</div></div>;

  const [tab, setTab] = React.useState('genel'); 
  const [refreshing, setRefreshing] = React.useState(false);
  const [uploading, setUploading] = React.useState(false);
  const [form, setForm] = React.useState(draft);
  const [newProduct, setNewProduct] = React.useState({ baslik: '', fiyat: '', gram: '', resim: '', kategori: 'Kolye', etiket: 'Genel', aciklama: '' });
  const [previewUrl, setPreviewUrl] = React.useState(null); 
  const [editingId, setEditingId] = React.useState(null);
  
  // YENİ: Eski resim URL'sini tutmak için state
  const [oldImageUrl, setOldImageUrl] = React.useState(null);
  // YENİ: Toplu güncelleme oranı için state
  const [bulkRate, setBulkRate] = React.useState("");

  const handleChange = (key, val) => { setForm({ ...form, [key]: Number(val) || val }); };

  // --- RESIZE YARDIMCI FONKSİYON (GÜNCELLENMİŞ: JPEG + Agresif Sıkıştırma) ---
  const resizeImage = (file) => {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 900;   // Daha küçük tut
          const MAX_HEIGHT = 900;  // Dikey fotolarda da sınır

          let width = img.width;
          let height = img.height;

          // Oranı bozmadan küçült
          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Blob'a çevir (JPEG formatında, %60 kalite)
          canvas.toBlob((blob) => {
            if (blob) {
                // Boyutu konsolda görmek için:
                console.log('Sıkıştırılmış boyut (MB):', (blob.size / (1024*1024)).toFixed(2));
                resolve(blob);
            } else {
                reject(new Error('Resim işlenirken hata oluştu.'));
            }
          }, 'image/jpeg', 0.6);
        };
        img.onerror = (err) => reject(new Error('Resim yüklenemedi.'));
      };
      reader.onerror = (err) => reject(new Error('Dosya okunamadı.'));
    });
  };

  // --- OPTİMİZE EDİLMİŞ UPLOAD (GÜNCELLENMİŞ: JPEG) ---
  const handleFileUpload = async (event) => {
    try {
      const file = event.target.files[0];
      if (!file) return;
      
      setUploading(true);

      const compressedBlob = await resizeImage(file);
      
      // Önizleme (sıkıştırılmış hal üzerinden)
      const localPreviewUrl = URL.createObjectURL(compressedBlob);
      setPreviewUrl(localPreviewUrl);

      const fileName = `vitrin_${Date.now()}.jpg`;
      
      const { data, error } = await supa.storage
        .from('resimler')
        .upload(fileName, compressedBlob, {
          contentType: 'image/jpeg',
          upsert: false
        }); 
      
      if (error) throw error;
      
      const { data: publicData } = supa.storage
        .from('resimler')
        .getPublicUrl(fileName);
        
      const publicUrl = publicData.publicUrl;
      
      setNewProduct({ ...newProduct, resim: publicUrl });
      
    } catch (error) { 
        console.error('Yükleme Hatası:', error);
        alert('Hata: ' + error.message); 
        setPreviewUrl(null);
    } finally { 
        setUploading(false); 
    }
  };

  // YENİ: URL'den dosya yolunu çıkaran yardımcı fonksiyon
  const getPathFromUrl = (url) => {
    if (!url) return null;
    const parts = url.split('/storage/v1/object/public/resimler/');
    return parts[1] || null;
  };

  const handleEditClick = (item) => {
      setNewProduct({ ...item });
      setPreviewUrl(item.resim);
      setEditingId(item.id);
      setOldImageUrl(item.resim); // YENİ: Eski URL'yi kaydet
  };

  const handleCancelEdit = () => {
      setNewProduct({ baslik: '', fiyat: '', gram: '', resim: '', kategori: 'Kolye', etiket: 'Genel', aciklama: '' });
      setPreviewUrl(null);
      setEditingId(null);
      setOldImageUrl(null); // YENİ: State'i temizle
  }

  const handleSaveProduct = async () => {
      if(!newProduct.baslik || !newProduct.fiyat) return alert("Başlık ve fiyat zorunludur.");
      
      const cleanPrice = newProduct.fiyat.toString().replace(/[^0-9]/g, '');
      const { id, created_at, ...rest } = newProduct;
      const productToSave = { ...rest, fiyat: cleanPrice };

      let error;

      if (editingId) {
          const res = await supa.from('vitrin').update(productToSave).eq('id', editingId);
          error = res.error;
      } else {
          const res = await supa.from('vitrin').insert(productToSave);
          error = res.error;
      }

      if (error) return alert("Hata: " + error.message);

      // YENİ: Eski resmi silme mantığı
      if (editingId && oldImageUrl && oldImageUrl !== newProduct.resim) {
        const path = getPathFromUrl(oldImageUrl);
        if (path) {
          await supa.storage.from('resimler').remove([path]);
        }
      }
      
      alert(editingId ? "Ürün güncellendi!" : "Ürün eklendi!");
      
      handleCancelEdit(); 
      refreshVitrin(); 
  };

  // GÜNCELLENDİ: Hem DB'den hem de Storage'dan silme işlemi
  const handleDeleteProduct = async (item) => {
      if (!confirm("Bu ürünü VE fotoğrafını silmek istiyor musunuz?")) return;

      // önce DB'den sil
      const { error } = await supa.from('vitrin').delete().eq('id', item.id);
      
      if (error) {
        alert("Silinemedi: " + error.message);
        return;
      }

      // sonra storage'tan fotoğrafı sil
      const path = getPathFromUrl(item.resim);
      if (path) {
          await supa.storage.from('resimler').remove([path]);
      }
      
      // eğer o anda edit modundaysan, state'i de temizle
      if (editingId === item.id) {
        handleCancelEdit();
      }

      refreshVitrin();
  };

  const forceRefreshAll = async () => {
    setRefreshing(true);
    try {
        const yeniVersiyon = (form.versiyon || 1) + 1;
        await supa.from('ham_fiyatlar').update({ versiyon: yeniVersiyon }).eq('id', 1);
        alert("Komut gönderildi! (v" + yeniVersiyon + ")");
    } catch (e) { alert("Hata: " + e.message); } finally { setRefreshing(false); }
  };

  // YENİ: Toplu Fiyat Güncelleme Fonksiyonu (Düzeltildi: Kesin Tamsayı + Küsürat Yuvarlama)
  const handleBulkUpdate = async () => {
      if (!bulkRate || bulkRate == 0) return alert("Lütfen bir oran giriniz (Örn: 10).");
      
      const rate = Number(bulkRate);
      const isIncrease = rate > 0;
      const confirmMsg = `DİKKAT! Tüm vitrin ürünlerinin fiyatını %${Math.abs(rate)} oranında ${isIncrease ? 'ARTIRMAK' : 'AZALTMAK'} istediğinize emin misiniz?`;
      
      if (!confirm(confirmMsg)) return;
      
      setRefreshing(true);
      
      try {
          // 1. Tüm ürünleri çek
          const { data: allItems, error: fetchError } = await supa.from('vitrin').select('*');
          if(fetchError) throw fetchError;

          // 2. Yeni fiyatları hesapla (ÖZEL YUVARLAMA KURALI İLE)
          const updates = allItems.map(item => {
              // Fiyatı temizle ve sayıya çevir (Güvenli parse)
              let dbPrice = item.fiyat;
              if (typeof dbPrice === 'string') {
                  // Sadece rakamları ve noktayı al (nokta ondalık ayraç olabilir)
                  // Eğer nokta binlik ayracı ise replace ile kaldırmalıyız.
                  // Genelde '1.500' -> 1500 olarak saklanıyorsa replace(/[^0-9]/g, "") daha güvenli.
                  dbPrice = parseFloat(dbPrice.toString().replace(/[^0-9.]/g, "")); 
              }
              
              // Ham yeni fiyatı hesapla
              let rawPrice = dbPrice * (1 + rate / 100);
              let newPrice = Math.round(rawPrice); // Önce en yakın tamsayıya yuvarla

              // İstenen Özel Kural:
              // 0,1,2,3,4 -> Aşağı 0'a yuvarla (Örn: 83 -> 80)
              // 5         -> Olduğu gibi kalsın (Örn: 85 -> 85)
              // 6,7,8,9   -> Yukarı 0'a yuvarla (Örn: 86 -> 90)
              
              const lastDigit = newPrice % 10;

              if (lastDigit === 5) {
                  // 5 ise dokunma, aynen kalsın
              } else if (lastDigit < 5) {
                  // 5'ten küçükse birler basamağını çıkar (Aşağı yuvarla)
                  newPrice = newPrice - lastDigit;
              } else {
                  // 5'ten büyükse 10'a tamamla (Yukarı yuvarla)
                  newPrice = newPrice + (10 - lastDigit);
              }
              
              // Sadece id ve fiyat bilgisini döndür
              return { 
                  ...item, // Tüm alanları koru
                  fiyat: newPrice 
              };
          });

          // 3. Upsert ile toplu güncelle
          const { error: updateError } = await supa.from('vitrin').upsert(updates);
          if(updateError) throw updateError;

          alert(`İşlem başarılı! ${updates.length} ürün güncellendi.`);
          setBulkRate(""); // Inputu temizle
          refreshVitrin(); // Listeyi yenile

      } catch(e) {
          alert("Hata oluştu: " + e.message);
      } finally {
          setRefreshing(false);
      }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal h-[90dvh]">
        <div className="flex border-b shrink-0">
            <button onClick={()=>setTab('genel')} className={`flex-1 py-4 text-sm font-bold ${tab==='genel' ? 'bg-yellow-50 text-yellow-800 border-b-2 border-yellow-500' : 'text-gray-500'}`}>📝 Fiyat</button>
            <button onClick={()=>setTab('vitrin')} className={`flex-1 py-4 text-sm font-bold ${tab==='vitrin' ? 'bg-yellow-50 text-yellow-800 border-b-2 border-yellow-500' : 'text-gray-500'}`}>💎 Vitrin</button>
        </div>
        <div className="flex-1 overflow-y-auto p-4 md:p-6">
            {tab === 'genel' && (
                <div>
                    <div className="mb-4 space-y-3">
                        <h4 className="text-[10px] font-bold text-gray-400 mb-2 uppercase">Manuel Fiyat Girişi</h4>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500">Çeyrek ALIŞ</label><input type="number" value={form.ceyrek_alis || ''} onChange={e=>handleChange('ceyrek_alis', e.target.value)} className="p-2 border rounded w-full font-mono" /></div>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500 font-bold">Çeyrek SATIŞ</label><input type="number" value={form.ceyrek_satis || ''} onChange={e=>handleChange('ceyrek_satis', e.target.value)} className="p-2 border rounded w-full font-bold font-mono" /></div>
                        <hr className="my-2"/>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500">Ata ALIŞ</label><input type="number" value={form.ata_alis || ''} onChange={e=>handleChange('ata_alis', e.target.value)} className="p-2 border rounded w-full font-mono" /></div>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500 font-bold">Ata SATIŞ</label><input type="number" value={form.ata_satis || ''} onChange={e=>handleChange('ata_satis', e.target.value)} className="p-2 border rounded w-full font-bold font-mono" /></div>
                        <hr className="my-2"/>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500">22 Ayar (Satış)</label><input type="number" value={form.gram_22 || ''} onChange={e=>handleChange('gram_22', e.target.value)} className="p-2 border rounded w-full font-mono" /></div>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500">Has Altın (24K)</label><input type="number" value={form.gram_24 || ''} onChange={e=>handleChange('gram_24', e.target.value)} className="p-2 border rounded w-full font-mono" /></div>
                    </div>
                    
                    <div className="mb-4 pt-4 border-t border-dashed">
                        <h4 className="text-[10px] font-bold text-gray-400 mb-2 uppercase">Kayan Yazı (Alt Şerit)</h4>
                        <input type="text" value={form.duyuru || ""} onChange={e=>handleChange('duyuru', e.target.value)} className="w-full p-2 border rounded text-xs" />
                    </div>

                    <div className="mb-4 pt-4 border-t border-dashed">
                        <h4 className="text-[10px] font-bold text-red-500 mb-2 uppercase">Ana Ekran Büyük Duyuru</h4>
                        <input type="text" value={form.buyuk_duyuru || ""} onChange={e=>handleChange('buyuk_duyuru', e.target.value)} className="w-full p-2 border border-red-200 rounded text-xs bg-red-50" placeholder="Örn: %20 İNDİRİM BAŞLADI!" />
                    </div>

                    <div className="pt-4 border-t">
                        <button onClick={forceRefreshAll} disabled={refreshing} className="w-full bg-gray-800 text-white text-xs py-3 rounded font-bold">{refreshing ? "..." : "🔄 Tüm Cihazları Yenile"}</button>
                    </div>
                </div>
            )}
            {tab === 'vitrin' && (
                <div>
                    {/* YENİ: TOPLU GÜNCELLEME ALANI */}
                    <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-200 mb-6 shadow-sm">
                        <h4 className="text-xs font-bold text-yellow-800 mb-2 flex items-center gap-2">
                            <span>⚡</span> TOPLU FİYAT GÜNCELLEME
                        </h4>
                        <div className="flex gap-2">
                            <input 
                                type="number" 
                                placeholder="%" 
                                value={bulkRate} 
                                onChange={e => setBulkRate(e.target.value)} 
                                className="w-20 p-2 border rounded-lg text-sm text-center font-bold outline-none focus:ring-2 focus:ring-yellow-400" 
                            />
                            <button 
                                onClick={handleBulkUpdate} 
                                disabled={refreshing}
                                className="flex-1 bg-yellow-600 text-white rounded-lg text-xs font-bold hover:bg-yellow-700 disabled:opacity-50 transition active:scale-95 shadow"
                            >
                                {refreshing ? "İşleniyor..." : "Tüm Fiyatlara Uygula"}
                            </button>
                        </div>
                        <p className="text-[10px] text-yellow-700/70 mt-2 leading-tight">
                            Örn: <b>10</b> yazarsan %10 zam yapar. <b>-5</b> yazarsan %5 indirim yapar.
                        </p>
                    </div>

                    <div className={`bg-gray-50 p-4 rounded-xl border mb-6 ${editingId ? 'border-blue-300 ring-2 ring-blue-100' : 'border-gray-200'}`}>
                        <div className="flex justify-between items-center mb-3">
                            <h4 className="text-xs font-bold text-gray-700">{editingId ? '✏️ ÜRÜN DÜZENLE' : '➕ YENİ ÜRÜN EKLE'}</h4>
                            {editingId && <button onClick={handleCancelEdit} className="text-xs text-red-500 font-bold underline">İptal</button>}
                        </div>
                        
                        <input type="text" placeholder="Ürün Adı" value={newProduct.baslik || ''} onChange={e=>setNewProduct({...newProduct, baslik: e.target.value})} className="w-full p-2 border rounded text-xs mb-2" />
                        
                        <div className="relative mb-2">
                            <input 
                                type="text" 
                                placeholder="Fiyat (Örn: 46890)" 
                                value={newProduct.fiyat || ''} 
                                onChange={e => {
                                    const val = e.target.value.replace(/[^0-9]/g, '');
                                    setNewProduct({...newProduct, fiyat: val});
                                }}
                                className="w-full p-2 border rounded text-xs font-mono" 
                            />
                            {newProduct.fiyat && <div className="absolute right-2 top-2 text-xs text-gray-400 font-bold">{formatCurrency(newProduct.fiyat)}</div>}
                        </div>

                        <input type="text" placeholder="Gram (Örn: 3.50 gr)" value={newProduct.gram || ''} onChange={e=>setNewProduct({...newProduct, gram: e.target.value})} className="w-full p-2 border rounded text-xs mb-2" />
                        
                        <div className="grid grid-cols-2 gap-2 mb-2">
                             <div>
                                <label className="text-[9px] text-gray-400 font-bold uppercase block mb-1">Ne Tür?</label>
                                <select value={newProduct.kategori || 'Kolye'} onChange={e=>setNewProduct({...newProduct, kategori: e.target.value})} className="w-full p-2 border rounded text-xs bg-white">
                                    <option value="Kolye">Kolye</option>
                                    <option value="Bilezik">Bilezik</option>
                                    <option value="Bileklik">Bileklik</option>
                                    <option value="Yüzük">Yüzük</option>
                                    <option value="Küpe">Küpe</option>
                                    <option value="Set">Set</option>
                                    <option value="Saat">Saat</option>
                                    <option value="Diğer">Diğer</option>
                                </select>
                             </div>
                             <div>
                                <label className="text-[9px] text-gray-400 font-bold uppercase block mb-1">Ne İçin?</label>
                                <select value={newProduct.etiket || 'Genel'} onChange={e=>setNewProduct({...newProduct, etiket: e.target.value})} className="w-full p-2 border rounded text-xs bg-white">
                                    <option value="Genel">Genel</option>
                                    <option value="Outlet">🔥 Outlet</option>
                                    <option value="Kendim İçin">Kendim İçin 🙋‍♀️</option>
                                    <option value="Yılbaşı">Yılbaşı 🎄</option>
                                    <option value="Sevgililer Günü">Sevgililer Günü ❤️</option>
                                    <option value="Anneler Günü">Anneler Günü 💐</option>
                                    <option value="Düğün/Nişan">Düğün/Nişan 👰</option>
                                    <option value="Doğum Günü">Doğum Günü 🎂</option>
                                    <option value="İçimden Geldi">İçimden Geldi 🎁</option>
                                    <option value="Diğer">Diğer</option>
                                </select>
                             </div>
                        </div>
                        
                        <div className="flex items-center gap-2 mb-2 p-2 border border-dashed rounded bg-gray-50">
                            <input type="file" accept="image/*" onChange={handleFileUpload} className="text-xs w-full" />
                            {uploading && <span className="text-xs text-blue-500 font-bold animate-pulse">Yükleniyor...</span>}
                        </div>
                        {previewUrl && (
                            <div className="mb-2 w-20 h-20 rounded overflow-hidden border relative group">
                                <img src={previewUrl} className="w-full h-full object-cover" />
                            </div>
                        )}

                        <button onClick={handleSaveProduct} className={`w-full text-white py-2 rounded text-xs font-bold ${editingId ? 'bg-blue-600 hover:bg-blue-700' : 'bg-green-600 hover:bg-green-700'}`}>
                            {editingId ? 'Ürünü Güncelle' : 'Listeye Ekle'}
                        </button>
                    </div>

                    <div className="space-y-2">
                        {vitrinItems.map(item => (
                            <div key={item.id} className={`flex items-center gap-3 p-2 border rounded bg-white ${editingId === item.id ? 'border-blue-400 ring-1 ring-blue-200' : ''}`}>
                                <img src={item.resim || "https://placehold.co/50"} className="w-10 h-10 rounded object-cover bg-gray-100" />
                                <div className="flex-1">
                                    <div className="text-xs font-bold">{item.baslik}</div>
                                    <div className="text-[9px] text-gray-400">{item.kategori} • {item.etiket}</div>
                                    <div className="text-[10px] font-mono text-green-600 font-bold">{formatCurrency(item.fiyat)}</div>
                                </div>
                                <div className="flex flex-col gap-1">
                                    <button type="button" onClick={()=>handleEditClick(item)} className="text-blue-500 hover:bg-blue-50 p-1 rounded text-xs border border-blue-100">✏️</button>
                                    {/* GÜNCELLENDİ: item.id yerine item objesi gönderiliyor */}
                                    <button 
                                        type="button" 
                                        onClick={() => handleDeleteProduct(item)} 
                                        className="text-red-500 hover:bg-red-50 p-1 rounded text-xs border border-red-100"
                                    >
                                        🗑️
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )}
        </div>
        {tab === 'genel' && (
            <div className="p-4 border-t bg-gray-50 text-right shrink-0">
                <button onClick={onClose} className="px-4 py-2 rounded text-gray-500 text-sm mr-2">Kapat</button>
                <button onClick={() => onSave(form)} className="px-4 py-2 rounded bg-yellow-600 text-white font-bold text-sm shadow">Kaydet</button>
            </div>
        )}
         {tab === 'vitrin' && (
            <div className="p-4 border-t bg-gray-50 text-right shrink-0"><button onClick={onClose} className="px-4 py-2 rounded text-gray-500 text-sm">Kapat</button></div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = React.useState('welcome'); 
  const [prices, setPrices] = React.useState(null); 
  const [lastUpdate, setLastUpdate] = React.useState(null);
  const [prevPrices, setPrevPrices] = React.useState(null);
  const [user, setUser] = React.useState(null);
  const [vitrinItems, setVitrinItems] = React.useState([]);
  const [loginOpen, setLoginOpen] = React.useState(false);
  const [adminOpen, setAdminOpen] = React.useState(false);
  const [stability, setStability] = React.useState(0);
  const [currentVersion, setCurrentVersion] = React.useState(null);
  const [locationOpen, setLocationOpen] = React.useState(false);
  
  const [customerModalOpen, setCustomerModalOpen] = React.useState(false);
  const [customers, setCustomers] = React.useState([]);
  const [pendingRemindersCount, setPendingRemindersCount] = React.useState(0);

  async function fetchData() {
      const { data: pData } = await supa.from("ham_fiyatlar").select("*").eq("id", 1).single();
      if (pData) { 
        setPrices(current => {
            if(current) setPrevPrices(current); 
            return pData; 
        });
        if(pData.versiyon) setCurrentVersion(pData.versiyon); 
      }
      setLastUpdate(new Date());
      setStability(0); 
  }

  async function loadInitialProducts() {
      const { data: vData } = await supa.from("vitrin").select("*").order('id', { ascending: false });
      if(vData) setVitrinItems(vData);
  }

  async function fetchCustomersAndReminders() {
      if(!user) return;
      const { data } = await supa.from('customers').select('*').order('created_at', { ascending: false });
      if(data) setCustomers(data);
      
      const r = await supa.from('customer_reminders').select('*').eq('status', 'pending');
      if(r.data) {
          const now = new Date();
          const due = r.data.filter(x => new Date(x.due_at) <= now);
          setPendingRemindersCount(due.length);
      }
  }

  React.useEffect(() => { 
      fetchData(); 
      loadInitialProducts(); 
      const interval = setInterval(fetchData, 3000);
      const stab = setInterval(() => setStability(s => s + 1), 1000);
      return () => { clearInterval(interval); clearInterval(stab); };
  }, []);

  React.useEffect(() => {
     if(user) fetchCustomersAndReminders();
  }, [user]);

  React.useEffect(() => {
      if(!currentVersion) return;
      const checkVersion = async () => {
          const { data } = await supa.from('ham_fiyatlar').select('versiyon').eq('id', 1).single();
          if (data?.versiyon && data.versiyon !== currentVersion) window.location.reload(); 
      };
      const timer = setInterval(checkVersion, 10000);
      return () => clearInterval(timer);
  }, [currentVersion]);

  const handleSave = async (newData) => {
      await supa.from("ham_fiyatlar").update(newData).eq("id", 1);
      setPrices(newData);
      setAdminOpen(false);
      setStability(0);
  };

  const P = prices || {}; 
  const g24 = P.gram_24 || 0;
  const s025 = Math.round(g24 * 0.33); 
  const s05_22 = Math.round((P.gram_22 || 0) * 0.55); 
  const s05_24 = Math.round(g24 * 0.55);
  const prevP = prevPrices || {}; 

  return (
    <>
      {view === 'welcome' && (
         <WelcomeScreen 
           onSelect={setView} 
           onLogin={() => setLoginOpen(true)} 
           onLocation={() => setLocationOpen(true)}
           announcement={P.buyuk_duyuru}
         />
      )}

      {view === 'showcase' && (
         <VitrinPage items={vitrinItems} onBack={() => setView('welcome')} />
      )}

      {/* Outlet artık React içinde render edilmiyor, ayrı sayfaya gidiyor */}

      {view === 'faq' && (
         <FAQPage onBack={() => setView('welcome')} />
      )}

      {view === 'market' && (
         <MarketDashboard 
            setView={setView} setLocationOpen={setLocationOpen} user={user} 
            setCustomerModalOpen={setCustomerModalOpen} pendingRemindersCount={pendingRemindersCount} 
            setAdminOpen={setAdminOpen} setLoginOpen={setLoginOpen} P={P} ft={ft} 
            lastUpdate={lastUpdate} s025={s025} 
            s05_22={s05_22} s05_24={s05_24} stability={stability} supa={supa} setUser={setUser}
            prevP={prevP}
         />
      )}

      {loginOpen && <LoginModal onClose={()=>setLoginOpen(false)} onLoginSuccess={(u)=>{setUser(u); setLoginOpen(false); setAdminOpen(true);}} />}
      
      {adminOpen && prices && (
          <AdminModal 
            open={adminOpen} 
            draft={prices} setDraft={setPrices} 
            vitrinItems={vitrinItems} refreshVitrin={loadInitialProducts}
            onClose={()=>setAdminOpen(false)} 
            onSave={handleSave} 
          />
      )}
      
      {customerModalOpen && user && (
          <CustomerModal 
            onClose={()=>setCustomerModalOpen(false)} 
            customers={customers}
            fetchCustomers={fetchCustomersAndReminders}
            fetchReminders={fetchCustomersAndReminders}
            currentUser={user}
          />
      )}

      {locationOpen && <LocationModal onClose={() => setLocationOpen(false)} />}
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
