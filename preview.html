<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tamir / İnceleme Servis Fişi - Görsel Paylaş</title>
<style>
  :root{--gold:#c6923a;--dark:#202533;--muted:#6d7480;--line:#d9dde5;--bg:#f3f4f6;--green:#128c7e}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--dark)}
  .bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb;padding:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button,label.filebtn{border:0;border-radius:10px;padding:11px 13px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:42px}
  .gold{background:var(--gold);color:white}.green{background:var(--green);color:white}.gray{background:#e9edf2;color:#202533}.blue{background:#2563eb;color:white}
  .note{width:100%;font-size:12px;color:#667085;text-align:center;line-height:1.35}.status{width:100%;text-align:center;font-size:13px;font-weight:700;color:#176b5f;min-height:20px}
  .page{max-width:900px;margin:14px auto;padding:0 10px 24px}.card{background:white;border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.08);padding:16px;margin-bottom:14px}
  .formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.full{grid-column:1/-1}.half{grid-column:span 2}.third{grid-column:span 1}
  label.txt{display:block;font-size:12px;font-weight:800;color:#4b5563;margin-bottom:5px} input,textarea{width:100%;border:1px solid #d7dce5;border-radius:10px;padding:10px;font-size:14px;background:white;color:#111827} textarea{min-height:74px;resize:vertical}
  .checks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.checks label{border:1px solid #d7dce5;border-radius:10px;padding:10px;font-weight:700;font-size:14px}.checks input{width:auto;margin-right:7px}
  #previewCanvas{width:100%;height:auto;background:white;border-radius:12px;border:1px solid #d7dce5;display:none}.previewTitle{font-weight:900;margin:0 0 10px;color:#202533}.small{font-size:12px;color:#667085;line-height:1.4}
  @media(max-width:720px){.formgrid,.checks{grid-template-columns:1fr}.half,.third{grid-column:1/-1}button,label.filebtn{flex:1 1 45%}}
</style>
</head>
<body>
<div class="bar">
  <label class="filebtn gold" for="photoInput">Ürün Fotoğrafı Ekle</label>
  <input id="photoInput" type="file" accept="image/*" style="display:none">
  <button id="makeBtn" class="blue">Rapor Görselini Oluştur</button>
  <button id="shareBtn" class="green">WhatsApp’a Gönder / Paylaş</button>
  <button id="downloadBtn" class="gray">Görseli İndir</button>
  <button id="clearBtn" class="gray">Temizle</button>
  <div class="note">PDF yok, kütüphane yok. Rapor görseli bu sayfanın içinde doğrudan PNG olarak çizilir.</div>
  <div id="status" class="status"></div>
</div>

<div class="page">
  <div class="card">
    <div class="formgrid">
      <div class="half"><label class="txt">Firma Adı</label><input id="firma" placeholder="Firma adı"></div>
      <div class="half"><label class="txt">Firma Telefon</label><input id="firmaTel" placeholder="0___ ___ __ __"></div>
      <div class="third"><label class="txt">Rapor No</label><input id="raporNo" placeholder="TR-0001"></div>
      <div class="third"><label class="txt">Tarih</label><input id="tarih" type="date"></div>
      <div class="third"><label class="txt">Durum</label><input id="durum" placeholder="İncelemede"></div>
      <div class="third"><label class="txt">Tahmini Teslim</label><input id="teslim" type="date"></div>

      <div class="half"><label class="txt">Müşteri Ad Soyad</label><input id="musteri" placeholder="Ad soyad"></div>
      <div class="half"><label class="txt">Müşteri Telefon</label><input id="telefon" placeholder="0___ ___ __ __"></div>

      <div class="half"><label class="txt">Ürün</label><input id="urun" placeholder="Yüzük, bileklik..."></div>
      <div><label class="txt">Ayar</label><input id="ayar" placeholder="14K / 18K / 22K"></div>
      <div><label class="txt">Gram</label><input id="gram" placeholder="0,00 gr"></div>
      <div><label class="txt">Adet</label><input id="adet" placeholder="1"></div>
      <div><label class="txt">Renk</label><input id="renk" placeholder="Sarı / Beyaz / Rose"></div>
      <div class="half"><label class="txt">Taş / Model</label><input id="tasModel" placeholder="Varsa"></div>

      <div class="full"><label class="txt">İşlem Türü</label><div class="checks">
        <label><input type="checkbox" class="islem" value="Ölçü">Ölçü</label>
        <label><input type="checkbox" class="islem" value="Kaynak">Kaynak</label>
        <label><input type="checkbox" class="islem" value="Taş">Taş</label>
        <label><input type="checkbox" class="islem" value="Cila">Cila</label>
        <label><input type="checkbox" class="islem" value="Kaplama">Kaplama</label>
        <label><input type="checkbox" class="islem" value="Kilit">Kilit</label>
        <label><input type="checkbox" class="islem" value="Eksik Parça">Eksik Parça</label>
        <label><input type="checkbox" class="islem" value="Diğer">Diğer</label>
      </div></div>

      <div class="full"><label class="txt">Müşterinin Bildirdiği Problem</label><textarea id="problem"></textarea></div>
      <div class="full"><label class="txt">Ürün Kabul Notu</label><textarea id="kabul"></textarea></div>
      <div class="full"><label class="txt">Teşhis</label><textarea id="teshis"></textarea></div>
      <div class="full"><label class="txt">Yapılacak İşlem</label><textarea id="yapilacak"></textarea></div>
      <div class="half"><label class="txt">Tahmini Ücret</label><input id="ucret" placeholder="₺"></div>
      <div class="half"><label class="txt">Ek Not</label><input id="ekNot" placeholder="Müşteri aranacak vb."></div>
    </div>
  </div>

  <div class="card">
    <p class="previewTitle">Oluşturulan Görsel</p>
    <canvas id="previewCanvas" width="1240" height="1754"></canvas>
    <p class="small">Paylaş ekranı açılmazsa görsel burada kalır. Telefonda görselin üstüne basılı tutup kaydedebilir veya “Görseli İndir” butonunu kullanabilirsin.</p>
  </div>
</div>

<script>
(function(){
  var W=1240,H=1754, gold='#c6923a', dark='#202533', muted='#667085', line='#d9dde5';
  var photoData=null, lastBlob=null;
  var canvas=document.getElementById('previewCanvas'), ctx=canvas.getContext('2d'), status=document.getElementById('status');
  function $(id){return document.getElementById(id)}
  function val(id){return ($(id).value||'').trim()}
  function setStatus(msg, bad){status.style.color=bad?'#b42318':'#176b5f';status.textContent=msg||''}
  function dateTR(s){ if(!s) return ''; var p=s.split('-'); return p.length===3 ? p[2]+'.'+p[1]+'.'+p[0] : s; }
  function rr(x,y,w,h,r,stroke,fill){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
  function text(t,x,y,size,weight,color,align){ctx.fillStyle=color||dark;ctx.font=(weight||'400')+' '+size+'px Arial, Helvetica, sans-serif';ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillText(t||'',x,y)}
  function lineH(x1,y,x2){ctx.strokeStyle=gold;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke()}
  function wrap(t,x,y,maxWidth,lineHeight,maxLines,size,weight,color){
    t=(t||'').replace(/\s+/g,' ').trim(); ctx.font=(weight||'400')+' '+size+'px Arial, Helvetica, sans-serif'; ctx.fillStyle=color||dark; ctx.textAlign='left';
    if(!t){return y}
    var words=t.split(' '), lineText='', lines=[];
    for(var n=0;n<words.length;n++){var test=lineText?lineText+' '+words[n]:words[n]; if(ctx.measureText(test).width>maxWidth && lineText){lines.push(lineText); lineText=words[n]} else lineText=test}
    if(lineText) lines.push(lineText); if(maxLines && lines.length>maxLines){lines=lines.slice(0,maxLines); lines[lines.length-1]+='...'}
    for(var i=0;i<lines.length;i++) ctx.fillText(lines[i],x,y+i*lineHeight);
    return y+lines.length*lineHeight;
  }
  function field(label,value,x,y,w,h){rr(x,y,w,h,12,line,'#fff'); text(label,x+14,y+22,17,'800',muted); wrap(value||'',x+14,y+50,w-28,24,2,22,'700',dark)}
  function sectionTitle(n,title,y){text(n+') '+title,60,y,22,'900',dark); lineH(60+ctx.measureText(n+') '+title).width+18,y-7,1180); return y+26}
  function boxText(t,x,y,w,h,placeholder){rr(x,y,w,h,14,line,'#fff'); if(t) wrap(t,x+16,y+30,w-32,28,Math.floor((h-25)/28),22,'500',dark); else text(placeholder||'',x+16,y+36,20,'400','#b0b7c3')}
  function drawCover(img,x,y,w,h){
    var r=Math.max(w/img.width,h/img.height), sw=w/r, sh=h/r, sx=(img.width-sw)/2, sy=(img.height-sh)/2;
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip(); ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h); ctx.restore();
  }
  function drawBase(img){
    ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    rr(38,38,1164,1678,24,'#ead6ad','#fff');
    // photo
    rr(62,70,260,250,18,gold,'#fbfbfc');
    if(img) drawCover(img,72,80,240,230); else {text('📷',192,170,46,'400','#a7aebb','center'); text('ÜRÜN FOTOĞRAFI',192,215,19,'800','#8b95a3','center')}
    // title
    text('◇',760,92,42,'400',gold,'center');
    text('TAMİR / İNCELEME SERVİS FİŞİ',760,160,46,'900',dark,'center');
    text('Müşteri Bilgilendirme Formu',760,202,27,'400',gold,'center');
    field('RAPOR NO',val('raporNo')||'TR-0001',365,235,240,82); field('TARİH',dateTR(val('tarih')),625,235,240,82); field('DURUM',val('durum')||'İncelemede',885,235,240,82);
    if(val('firma')||val('firmaTel')) { text((val('firma')||'Firma')+'  |  '+(val('firmaTel')||''),760,342,20,'700',muted,'center') }
    var y=395;
    y=sectionTitle(1,'MÜŞTERİ BİLGİLERİ',y); field('Ad Soyad',val('musteri'),60,y,540,72); field('Telefon',val('telefon'),625,y,555,72); y+=102;
    y=sectionTitle(2,'ÜRÜN BİLGİLERİ',y); field('Ürün',val('urun'),60,y,430,72); field('Ayar',val('ayar'),510,y,200,72); field('Gram',val('gram'),730,y,210,72); field('Adet',val('adet')||'1',960,y,220,72); y+=90;
    field('Renk',val('renk'),60,y,360,72); field('Taş / Model',val('tasModel'),440,y,740,72); y+=104;
    y=sectionTitle(3,'İŞLEM TÜRÜ',y); var opts=['Ölçü','Kaynak','Taş','Cila','Kaplama','Kilit','Eksik Parça','Diğer']; var checked={}; document.querySelectorAll('.islem').forEach(function(c){checked[c.value]=c.checked});
    var ox=60, oy=y, bw=260,bh=54,gap=22; for(var i=0;i<opts.length;i++){var col=i%4,row=Math.floor(i/4),x=ox+col*(bw+gap), yy=oy+row*(bh+14); rr(x,yy,bw,bh,12,line,'#fff'); ctx.strokeStyle=dark; ctx.lineWidth=2; ctx.strokeRect(x+20,yy+17,20,20); if(checked[opts[i]]){ctx.beginPath();ctx.moveTo(x+23,yy+27);ctx.lineTo(x+30,yy+34);ctx.lineTo(x+40,yy+20);ctx.stroke()} text(opts[i],x+55,yy+36,20,'700',dark)} y+=136;
    y=sectionTitle(4,'MÜŞTERİNİN BİLDİRDİĞİ PROBLEM',y); boxText(val('problem'),60,y,1120,92,'Problem açıklaması...'); y+=122;
    y=sectionTitle(5,'ÜRÜN KABUL NOTU',y); boxText(val('kabul'),60,y,1120,92,'Çizik, ezik, eksik taş, teslim durumu...'); y+=122;
    y=sectionTitle(6,'TEŞHİS',y); boxText(val('teshis'),60,y,1120,92,'Usta inceleme sonucu...'); y+=122;
    y=sectionTitle(7,'YAPILACAK İŞLEM',y); boxText(val('yapilacak'),60,y,1120,92,'Uygulanacak işlem...'); y+=126;
    field('8) TAHMİNİ TESLİM TARİHİ',dateTR(val('teslim')),60,y,430,82); field('TAHMİNİ ÜCRET',val('ucret'),530,y,290,82); field('NOT',val('ekNot'),850,y,330,82); y+=128;
    lineH(60,y,1180); y+=48; text('9) MÜŞTERİ ONAYI / İMZA',60,y,21,'900',dark); text('TESLİM ALAN YETKİLİ / İMZA',675,y,21,'900',dark); ctx.strokeStyle='#808896'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(60,y+64);ctx.lineTo(545,y+64);ctx.moveTo(675,y+64);ctx.lineTo(1180,y+64);ctx.stroke();
    text('Bu form ürün kabul ve ön inceleme fişidir. Nihai işlem ve ücret, detaylı inceleme sonrası müşteriye bildirilir.',620,1688,18,'400',muted,'center');
  }
  function loadPhoto(){return new Promise(function(resolve){ if(!photoData) return resolve(null); var img=new Image(); img.onload=function(){resolve(img)}; img.onerror=function(){resolve(null)}; img.src=photoData; });}
  async function makeImage(){setStatus('Görsel hazırlanıyor...'); var img=await loadPhoto(); drawBase(img); canvas.style.display='block'; lastBlob=await new Promise(function(res){canvas.toBlob(res,'image/png',1)}); if(lastBlob) setStatus('Rapor görseli hazır. Paylaşabilir veya indirebilirsin.'); else setStatus('Görsel ekranda hazır; indirme desteklenmiyorsa üzerine basılı tutup kaydet.', false); return lastBlob;}
  async function download(){var blob=lastBlob||await makeImage(); var a=document.createElement('a'); a.href=blob?URL.createObjectURL(blob):canvas.toDataURL('image/png'); a.download='tamir-servis-fisi.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){try{URL.revokeObjectURL(a.href)}catch(e){}},1000); setStatus('Görsel indirildi. WhatsApp’tan görsel olarak gönderebilirsin.');}
  async function share(){var blob=lastBlob||await makeImage(); if(!blob){setStatus('Paylaşım açılamadı; görsel aşağıda hazır, üzerine basılı tutup kaydedebilirsin.', true); return}
    var file=new File([blob],'tamir-servis-fisi.png',{type:'image/png'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Tamir / İnceleme Servis Fişi',text:'Tamir / İnceleme Servis Fişi'}); setStatus('Paylaşım ekranı açıldı.'); return} catch(e){ setStatus('Paylaşım iptal edildi veya cihaz izin vermedi. Görsel aşağıda hazır.', false); return }
    }
    await download(); setStatus('Bu cihaz direkt paylaşımı desteklemedi; görsel indirildi. WhatsApp’tan gönder.');
  }
  $('photoInput').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){photoData=r.result; lastBlob=null; setStatus('Fotoğraf eklendi. Rapor görselini oluşturabilirsin.');}; r.readAsDataURL(f)});
  $('makeBtn').addEventListener('click',makeImage); $('downloadBtn').addEventListener('click',download); $('shareBtn').addEventListener('click',share);
  $('clearBtn').addEventListener('click',function(){document.querySelectorAll('input[type=text],input[type=date],textarea').forEach(function(el){el.value=''});document.querySelectorAll('input[type=checkbox]').forEach(function(el){el.checked=false});photoData=null;lastBlob=null;canvas.style.display='none';setStatus('Form temizlendi.')});
})();
</script>
</body>
</html>
