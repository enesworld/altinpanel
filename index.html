const AnimatedValue = React.memo(({ value, prev }) => {
  if (value === undefined || value === null || isNaN(value) || value === 0) {
    return <div className="text-xl text-gray-300 font-bold">...</div>;
  }
  let cls = "text-xl font-bold tracking-tight transition-all duration-500";
  if (prev && value !== prev) cls = value > prev ? "flash-up" : "flash-down";
  return (
    <div className={cls}>
      {fp(Math.round(value))} <span className="text-sm font-normal text-gray-400">₺</span>
    </div>
  );
});

// --- AKILLI VİTRİN SİHİRBAZI ---
function VitrinPage({ onBack, items }) {
  const [step, setStep] = React.useState(0); // 0: Ana Seçim, 1: Seçenekler, 2: Liste
  const [filterType, setFilterType] = React.useState(null); 
  const [selectedFilter, setSelectedFilter] = React.useState(null);
  const [priceRange, setPriceRange] = React.useState('all');

  // Filtreleme Mantığı
  const filteredItems = React.useMemo(() => {
    let result = items;

    // 1. Kategori/Etiket Filtresi
    if (selectedFilter) {
      // DİKKAT: Veritabanında kategori ve etiket sütunları olmalı
      if (filterType === 'category') result = result.filter(i => i.kategori === selectedFilter);
      if (filterType === 'tag') result = result.filter(i => i.etiket === selectedFilter);
    }

    // 2. Fiyat Filtresi
    if (priceRange !== 'all') {
      result = result.filter(item => {
         const cleanPrice = item.fiyat ? parseInt(item.fiyat.toString().replace(/\./g, '').replace(/[^0-9]/g, '')) : 0;
         if (priceRange === 'low') return cleanPrice <= 5000;
         if (priceRange === 'mid') return cleanPrice > 5000 && cleanPrice <= 15000;
         if (priceRange === 'high') return cleanPrice > 15000 && cleanPrice <= 30000;
         if (priceRange === 'premium') return cleanPrice > 30000;
         return true;
      });
    }
    return result;
  }, [items, selectedFilter, filterType, priceRange]);

  // Adım 0: Yol Ayrımı
  if (step === 0) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-[#b45309] via-[#d97706] to-[#92400e] p-6 fade-in text-center relative overflow-hidden">
         <button onClick={onBack} className="absolute top-6 left-6 text-2xl bg-white/20 backdrop-blur p-3 rounded-full text-white hover:bg-white/40 transition shadow-lg">⬅️</button>
         <h2 className="text-3xl font-serif font-bold text-white mb-10 drop-shadow-lg">Size Nasıl Yardımcı Olalım?</h2>
         <div className="grid gap-6 w-full max-w-md">
            <button onClick={() => { setFilterType('tag'); setStep(1); }} className="bg-white/10 backdrop-blur-xl border border-white/40 text-white p-6 rounded-3xl shadow-xl flex items-center justify-between hover:bg-white/20 transition transform active:scale-95">
              <span className="text-left"><span className="block text-xl font-bold mb-1">🎁 Ne İçin Bakıyorsunuz?</span><span className="text-xs text-yellow-100/80 font-medium tracking-wide">Hediye, Özel Gün, Yatırım...</span></span><span className="text-3xl opacity-80">👉</span>
            </button>
            <button onClick={() => { setFilterType('category'); setStep(1); }} className="bg-white/10 backdrop-blur-xl border border-white/40 text-white p-6 rounded-3xl shadow-xl flex items-center justify-between hover:bg-white/20 transition transform active:scale-95">
              <span className="text-left"><span className="block text-xl font-bold mb-1">💍 Ne Tür Bakıyorsunuz?</span><span className="text-xs text-yellow-100/80 font-medium tracking-wide">Kolye, Bilezik, Yüzük...</span></span><span className="text-3xl opacity-80">👉</span>
            </button>
            <button onClick={() => { setFilterType(null); setSelectedFilter(null); setStep(2); }} className="mt-4 text-white/60 text-xs font-bold uppercase tracking-widest hover:text-white transition underline">Tüm Koleksiyonu Göster</button>
         </div>
      </div>
    );
  }

  // Adım 1: Seçenekler
  if (step === 1) {
    const options = filterType === 'tag' 
      ? ["Yılbaşı", "Sevgililer Günü", "Anneler Günü", "Düğün/Nişan", "Doğum Günü", "İçimden Geldi", "Diğer"]
      : ["Kolye", "Bilezik", "Yüzük", "Küpe", "Set", "Saat", "Diğer"];
    const title = filterType === 'tag' ? "Hangi Özel Gün?" : "Hangi Kategori?";

    return (
      <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-[#b45309] via-[#d97706] to-[#92400e] p-6 fade-in relative overflow-hidden">
        <div className="absolute top-0 left-0 w-full p-6 flex items-center">
           <button onClick={() => setStep(0)} className="text-2xl bg-white/20 backdrop-blur p-3 rounded-full text-white hover:bg-white/40 transition shadow-lg">⬅️</button>
        </div>
        <h2 className="text-3xl font-serif font-bold text-white mb-8 drop-shadow-lg text-center">{title}</h2>
        <div className="bg-white/95 backdrop-blur-xl rounded-[2rem] shadow-2xl p-6 w-full max-w-lg border border-white/50">
            <div className="grid grid-cols-2 gap-3">
              {options.map(opt => (
                <button key={opt} onClick={() => { setSelectedFilter(opt); setStep(2); }} className="bg-gray-50 border border-gray-200 text-gray-700 p-4 rounded-xl shadow-sm font-bold text-sm hover:bg-[#b45309] hover:text-white hover:border-[#b45309] hover:shadow-md transition active:scale-95">
                  {opt}
                </button>
              ))}
            </div>
        </div>
      </div>
    );
  }

  // Adım 2: Ürün Listesi
  return (
    <div className="min-h-screen bg-[#fdfcf8] flex flex-col fade-in relative">
       {/* Üst Bar */}
       <div className="p-6 sticky top-0 z-50 bg-[#fdfcf8]/95 backdrop-blur-sm border-b border-gray-100">
          <div className="flex items-center justify-between mb-4">
             <button onClick={() => setStep(0)} className="text-xl text-gray-400 hover:text-black transition transform active:scale-90">✕</button>
             <h1 className="text-xs font-bold text-gray-400 tracking-[0.3em] uppercase">{selectedFilter || "Tüm Koleksiyon"}</h1>
             <div className="w-5"></div>
          </div>
          {/* Fiyat Filtresi */}
          <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
             {[
               { label: 'Tümü', val: 'all' },
               { label: '0-5 Bin ₺', val: 'low' },
               { label: '5-15 Bin ₺', val: 'mid' },
               { label: '15-30 Bin ₺', val: 'high' },
               { label: '30 Bin+ ₺', val: 'premium' },
             ].map(f => (
               <button 
                 key={f.val}
                 onClick={() => setPriceRange(f.val)}
                 className={`px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-wider whitespace-nowrap transition ${priceRange === f.val ? 'bg-[#b45309] text-white shadow-md' : 'bg-white border border-gray-200 text-gray-500 hover:border-[#b45309] hover:text-[#b45309]'}`}
               >
                 {f.label}
               </button>
             ))}
          </div>
       </div>

       {/* Liste */}
       <div className="flex flex-col pb-20 px-6 pt-2">
          {filteredItems.length > 0 ? filteredItems.map((urun, index) => (
             <div key={urun.id} className="group bg-white mb-8 rounded-[2rem] shadow-[0_5px_30px_-10px_rgba(0,0,0,0.05)] overflow-hidden border border-gray-50 fade-in" style={{animationDelay: `${index * 0.1}s`}}>
                <div className="pt-8 pb-2 flex justify-center">
                    <div className="w-48 h-48 relative rounded-full bg-[#faf9f6] overflow-hidden shadow-inner border border-white ring-1 ring-gray-100">
                       <img src={urun.resim || "https://placehold.co/200x200?text=..."} className="w-full h-full object-cover hover:scale-110 transition duration-700 ease-in-out" alt={urun.baslik} />
                    </div>
                </div>
                <div className="p-6 text-center">
                    <div className="text-[9px] font-bold text-yellow-600 uppercase tracking-widest mb-2">{urun.kategori || 'ÖZEL'} PARÇA</div>
                    <h2 className="font-serif text-xl text-gray-900 mb-2 leading-tight">{urun.baslik}</h2>
                    {urun.aciklama && <p className="text-[10px] text-gray-400 font-light mb-4 line-clamp-1">{urun.aciklama}</p>}
                    <div className="w-8 h-[1px] bg-gray-200 mx-auto mb-4"></div>
                    <div className="flex flex-col gap-2 items-center">
                        <span className="text-lg font-medium text-gray-900 font-mono tracking-tighter">{urun.fiyat}</span>
                        <button onClick={() => window.open(`https://ig.me/m/bakirkoykuyumcusu`, '_blank')} className="text-[9px] font-bold uppercase tracking-[0.2em] text-pink-600 border-b border-pink-200 pb-1 hover:text-pink-800 hover:border-pink-800 transition-all">Instagram'dan Ayırt 💬</button>
                    </div>
                </div>
             </div>
          )) : (
            <div className="flex flex-col items-center justify-center py-32 text-gray-300">
                <span className="text-4xl mb-4 opacity-20">🏷️</span>
                <p className="font-serif italic text-sm">Bu kriterlere uygun ürün yok.</p>
                <button onClick={() => setPriceRange('all')} className="mt-4 text-[#b45309] text-xs font-bold underline">Filtreyi Temizle</button>
            </div>
          )}
       </div>
    </div>
  );
}

// --- LOGIN MODAL ---
function LoginModal({ onClose, onLoginSuccess }) {
  const [email, setEmail] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [error, setError] = React.useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    login();
  };

  async function login() {
    const { data, error } = await supa.auth.signInWithPassword({ email, password });
    if (error) setError("Hatalı giriş!"); else onLoginSuccess(data.user);
  }

  return (
    <div className="modal-backdrop">
      <div className="modal p-8 bg-gradient-to-br from-yellow-900/90 to-amber-800/90 backdrop-blur-xl border border-yellow-500/30 shadow-2xl rounded-3xl w-full max-w-sm relative overflow-hidden">
        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-yellow-400 to-transparent opacity-50"></div>
        <div className="absolute -top-10 -right-10 w-32 h-32 bg-yellow-500 blur-3xl opacity-20 rounded-full"></div>

        <h3 className="text-2xl font-serif font-bold text-white mb-6 text-center tracking-wide drop-shadow-sm">Yönetici Girişi</h3>
        
        <form onSubmit={handleSubmit} className="flex flex-col gap-4">
          <div className="relative">
              <span className="absolute left-3 top-3 text-yellow-200/50 text-lg">✉️</span>
              <input className="w-full pl-10 pr-4 py-3 rounded-xl bg-black/20 border border-yellow-500/20 text-white placeholder-yellow-100/30 focus:outline-none focus:border-yellow-400/50 focus:bg-black/40 transition" type="email" placeholder="E-posta Adresi" value={email} onChange={e=>setEmail(e.target.value)} />
          </div>
          <div className="relative">
              <span className="absolute left-3 top-3 text-yellow-200/50 text-lg">🔒</span>
              <input className="w-full pl-10 pr-4 py-3 rounded-xl bg-black/20 border border-yellow-500/20 text-white placeholder-yellow-100/30 focus:outline-none focus:border-yellow-400/50 focus:bg-black/40 transition" type="password" placeholder="Şifre" value={password} onChange={e=>setPassword(e.target.value)} />
          </div>
          {error && <div className="text-red-300 text-xs font-bold text-center bg-red-900/30 py-2 rounded-lg border border-red-500/30">{error}</div>}
          <div className="flex gap-3 mt-2">
            <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl text-yellow-200/60 font-bold hover:bg-white/5 hover:text-white transition text-sm border border-transparent hover:border-white/10">Vazgeç</button>
            <button type="submit" className="flex-1 py-3 rounded-xl bg-gradient-to-r from-yellow-500 to-orange-600 text-white font-bold shadow-lg hover:shadow-orange-500/30 hover:scale-[1.02] transition transform active:scale-95 border border-yellow-400/50">Giriş Yap</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function AdminModal({ open, draft, setDraft, vitrinItems, refreshVitrin, onClose, onSave }) {
  if (!open) return null;
  if (!draft) return <div className="modal-backdrop"><div className="modal p-6 text-center">Veriler Yükleniyor...<button onClick={onClose} className="mt-4 text-sm text-red-500">İptal</button></div></div>;

  const [tab, setTab] = React.useState('genel'); 
  const [refreshing, setRefreshing] = React.useState(false);
  const [uploading, setUploading] = React.useState(false);
  const [form, setForm] = React.useState(draft);
  const [newProduct, setNewProduct] = React.useState({ baslik: '', fiyat: '', resim: '', kategori: 'Kolye', etiket: 'Genel' });

  const handleChange = (key, val) => { setForm({ ...form, [key]: Number(val) || val }); };

  const handleFileUpload = async (event) => {
    try {
      const file = event.target.files[0];
      if (!file) return;
      setUploading(true);
      const fileName = `vitrin_${Date.now()}`;
      const { data, error } = await supa.storage.from('resimler').upload(fileName, file); 
      if (error) throw error;
      const { data: { publicUrl } } = supa.storage.from('resimler').getPublicUrl(fileName);
      setNewProduct({ ...newProduct, resim: publicUrl });
    } catch (error) { alert('Hata: ' + error.message); } finally { setUploading(false); }
  };

  const handleAddProduct = async () => {
      if(!newProduct.baslik || !newProduct.fiyat) return alert("Başlık ve fiyat zorunludur.");
      await supa.from('vitrin').insert(newProduct);
      setNewProduct({ baslik: '', fiyat: '', resim: '', kategori: 'Kolye', etiket: 'Genel' });
      refreshVitrin(); alert("Ürün eklendi!");
  };

  const handleDeleteProduct = async (id) => {
      if(confirm("Silmek istiyor musunuz?")) { await supa.from('vitrin').delete().eq('id', id); refreshVitrin(); }
  };

  const forceRefreshAll = async () => {
    setRefreshing(true);
    try {
        const yeniVersiyon = (form.versiyon || 1) + 1;
        await supa.from('ham_fiyatlar').update({ versiyon: yeniVersiyon }).eq('id', 1);
        alert("Komut gönderildi! (v" + yeniVersiyon + ")");
    } catch (e) { alert("Hata: " + e.message); } finally { setRefreshing(false); }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal h-[80vh]">
        <div className="flex border-b">
            <button onClick={()=>setTab('genel')} className={`flex-1 py-4 text-sm font-bold ${tab==='genel' ? 'bg-yellow-50 text-yellow-800 border-b-2 border-yellow-500' : 'text-gray-500'}`}>📝 Fiyat</button>
            <button onClick={()=>setTab('vitrin')} className={`flex-1 py-4 text-sm font-bold ${tab==='vitrin' ? 'bg-yellow-50 text-yellow-800 border-b-2 border-yellow-500' : 'text-gray-500'}`}>💎 Vitrin</button>
        </div>
        <div className="flex-1 overflow-y-auto p-6">
            {tab === 'genel' && (
                <div>
                    <div className="mb-4 space-y-3">
                        <h4 className="text-[10px] font-bold text-gray-400 mb-2 uppercase">Manuel Fiyat Girişi</h4>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500">Çeyrek ALIŞ</label><input type="number" value={form.ceyrek_alis || ''} onChange={e=>handleChange('ceyrek_alis', e.target.value)} className="p-2 border rounded w-full font-mono" /></div>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500 font-bold">Çeyrek SATIŞ</label><input type="number" value={form.ceyrek_satis || ''} onChange={e=>handleChange('ceyrek_satis', e.target.value)} className="p-2 border rounded w-full font-bold font-mono" /></div>
                        <hr className="my-2"/>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500">Ata ALIŞ</label><input type="number" value={form.ata_alis || ''} onChange={e=>handleChange('ata_alis', e.target.value)} className="p-2 border rounded w-full font-mono" /></div>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500 font-bold">Ata SATIŞ</label><input type="number" value={form.ata_satis || ''} onChange={e=>handleChange('ata_satis', e.target.value)} className="p-2 border rounded w-full font-bold font-mono" /></div>
                        <hr className="my-2"/>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500">22 Ayar (Satış)</label><input type="number" value={form.gram_22 || ''} onChange={e=>handleChange('gram_22', e.target.value)} className="p-2 border rounded w-full font-mono" /></div>
                        <div className="grid grid-cols-2 gap-2"><label className="text-xs text-gray-500">Has Altın (24K)</label><input type="number" value={form.gram_24 || ''} onChange={e=>handleChange('gram_24', e.target.value)} className="p-2 border rounded w-full font-mono" /></div>
                    </div>
                    <div className="mb-4 pt-4 border-t border-dashed">
                        <h4 className="text-[10px] font-bold text-gray-400 mb-2 uppercase">Kayan Yazı</h4>
                        <input type="text" value={form.duyuru || ""} onChange={e=>handleChange('duyuru', e.target.value)} className="w-full p-2 border rounded text-xs" />
                    </div>
                    <div className="pt-4 border-t">
                        <button onClick={forceRefreshAll} disabled={refreshing} className="w-full bg-gray-800 text-white text-xs py-3 rounded font-bold">{refreshing ? "..." : "🔄 Tüm Cihazları Yenile"}</button>
                    </div>
                </div>
            )}
            {tab === 'vitrin' && (
                <div>
                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-6">
                        <h4 className="text-xs font-bold text-gray-700 mb-3">➕ YENİ ÜRÜN EKLE</h4>
                        <input type="text" placeholder="Ürün Adı" value={newProduct.baslik} onChange={e=>setNewProduct({...newProduct, baslik: e.target.value})} className="w-full p-2 border rounded text-xs mb-2" />
                        <input type="text" placeholder="Fiyat (Örn: 14.500 ₺)" value={newProduct.fiyat} onChange={e=>setNewProduct({...newProduct, fiyat: e.target.value})} className="w-full p-2 border rounded text-xs mb-2" />
                        
                        {/* KATEGORİ VE ETİKET SEÇİMİ (Sihirbaz İçin Kritik) */}
                        <div className="grid grid-cols-2 gap-2 mb-2">
                             <div>
                                <label className="text-[9px] text-gray-400 font-bold uppercase block mb-1">Ne Tür?</label>
                                <select value={newProduct.kategori} onChange={e=>setNewProduct({...newProduct, kategori: e.target.value})} className="w-full p-2 border rounded text-xs bg-white">
                                    <option value="Kolye">Kolye</option>
                                    <option value="Bilezik">Bilezik</option>
                                    <option value="Yüzük">Yüzük</option>
                                    <option value="Küpe">Küpe</option>
                                    <option value="Set">Set</option>
                                    <option value="Saat">Saat</option>
                                    <option value="Diğer">Diğer</option>
                                </select>
                             </div>
                             <div>
                                <label className="text-[9px] text-gray-400 font-bold uppercase block mb-1">Ne İçin?</label>
                                <select value={newProduct.etiket} onChange={e=>setNewProduct({...newProduct, etiket: e.target.value})} className="w-full p-2 border rounded text-xs bg-white">
                                    <option value="Genel">Genel</option>
                                    <option value="Yılbaşı">Yılbaşı 🎄</option>
                                    <option value="Sevgililer Günü">Sevgililer Günü ❤️</option>
                                    <option value="Anneler Günü">Anneler Günü 💐</option>
                                    <option value="Düğün/Nişan">Düğün/Nişan 👰</option>
                                    <option value="Doğum Günü">Doğum Günü 🎂</option>
                                    <option value="İçimden Geldi">İçimden Geldi 🎁</option>
                                    <option value="Diğer">Diğer</option>
                                </select>
                             </div>
                        </div>

                        <div className="flex items-center gap-2 mb-2"><input type="file" onChange={handleFileUpload} className="text-xs w-full" />{uploading && <span className="text-xs text-blue-500">...</span>}</div>
                        <button onClick={handleAddProduct} className="w-full bg-green-600 text-white py-2 rounded text-xs font-bold hover:bg-green-700">Listeye Ekle</button>
                    </div>
                    <div className="space-y-2">
                        {vitrinItems.map(item => (
                            <div key={item.id} className="flex items-center gap-3 p-2 border rounded bg-white">
                                <img src={item.resim || "https://placehold.co/50"} className="w-10 h-10 rounded object-cover bg-gray-100" />
                                <div className="flex-1">
                                    <div className="text-xs font-bold">{item.baslik}</div>
                                    <div className="text-[9px] text-gray-400">{item.kategori} • {item.etiket}</div>
                                </div>
                                <button onClick={()=>handleDeleteProduct(item.id)} className="text-red-500 hover:bg-red-50 p-2 rounded">🗑️</button>
                            </div>
                        ))}
                    </div>
                </div>
            )}
        </div>
        {tab === 'genel' && (
            <div className="p-4 border-t bg-gray-50 text-right">
                <button onClick={onClose} className="px-4 py-2 rounded text-gray-500 text-sm mr-2">Kapat</button>
                <button onClick={() => onSave(form)} className="px-4 py-2 rounded bg-yellow-600 text-white font-bold text-sm shadow">Kaydet</button>
            </div>
        )}
         {tab === 'vitrin' && (
            <div className="p-4 border-t bg-gray-50 text-right"><button onClick={onClose} className="px-4 py-2 rounded text-gray-500 text-sm">Kapat</button></div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = React.useState('welcome');
  const [prices, setPrices] = React.useState(null); 
  const [lastUpdate, setLastUpdate] = React.useState(null);
  const [user, setUser] = React.useState(null);
  const [vitrinItems, setVitrinItems] = React.useState([]);
  const [loginOpen, setLoginOpen] = React.useState(false);
  const [adminOpen, setAdminOpen] = React.useState(false);
  const [stability, setStability] = React.useState(0);
  const [currentVersion, setCurrentVersion] = React.useState(null);
  const [locationOpen, setLocationOpen] = React.useState(false);

  async function fetchData() {
      const { data: pData } = await supa.from("ham_fiyatlar").select("*").eq("id", 1).single();
      if (pData) { setPrices(pData); if(pData.versiyon) setCurrentVersion(pData.versiyon); }
      const { data: vData } = await supa.from("vitrin").select("*").order('id', { ascending: false });
      if(vData) setVitrinItems(vData);
      setLastUpdate(new Date());
  }

  React.useEffect(() => { 
      fetchData(); 
      const interval = setInterval(fetchData, 3000);
      const stab = setInterval(() => setStability(s => s + 1), 1000);
      return () => { clearInterval(interval); clearInterval(stab); };
  }, []);

  React.useEffect(() => {
      if(!currentVersion) return;
      const checkVersion = async () => {
          const { data } = await supa.from('ham_fiyatlar').select('versiyon').eq('id', 1).single();
          if (data?.versiyon && data.versiyon !== currentVersion) window.location.reload(); 
      };
      const timer = setInterval(checkVersion, 10000);
      return () => clearInterval(timer);
  }, [currentVersion]);

  const downloadImage = async () => {
    const el = document.getElementById("capture-area");
    if(!el) return;
    const canvas = await html2canvas(el, { scale: 3, backgroundColor: null, useCORS: true });
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/png");
    link.download = `Fiyatlar_${new Date().toLocaleDateString()}.png`;
    link.click();
  }

  const handleSave = async (newData) => {
      await supa.from("ham_fiyatlar").update(newData).eq("id", 1);
      setPrices(newData);
      setAdminOpen(false);
      setStability(0);
  };

  const P = prices || {}; 
  const g24 = P.gram_24 || 0;
  const s025 = Math.round(g24 * 0.33); 
  const s05_22 = Math.round((P.gram_22 || 0) * 0.55); 
  const s05_24 = Math.round(g24 * 0.55);

  return (
    <>
      {view === 'welcome' ? (
         <WelcomeScreen onSelect={setView} onLogin={() => setLoginOpen(true)} onLocation={() => setLocationOpen(true)} />
      ) : view === 'showcase' ? (
         <VitrinPage items={vitrinItems} onBack={() => setView('welcome')} />
      ) : (
         <div className="min-h-screen pb-16 flex flex-col items-center bg-gray-50 fade-in">
            <div className="fixed top-0 left-0 w-full p-4 flex justify-between items-start z-50 pointer-events-none">
              <div className="pointer-events-auto flex gap-2">
                <button onClick={() => setView('welcome')} className="bg-white/80 backdrop-blur text-gray-600 w-10 h-10 rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">🏠</button>
                <button onClick={() => setLocationOpen(true)} className="bg-white/80 backdrop-blur text-blue-600 w-10 h-10 rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">📍</button>
                {user && <button onClick={async()=>{await supa.auth.signOut(); setUser(null);}} className="bg-white/80 backdrop-blur text-red-600 px-3 py-1 rounded-full shadow text-xs font-bold h-10 flex items-center">Çıkış</button>}
              </div>
              <div className="flex gap-3 pointer-events-auto">
                <button onClick={() => window.open('ham.html', '_blank')} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">📜</button>
                <button onClick={() => window.open('profit.html', '_blank')} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">📟</button>
                <button onClick={downloadImage} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">📸</button>
                <button onClick={()=>(user?setAdminOpen(true):setLoginOpen(true))} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow flex items-center justify-center text-xl hover:scale-110 transition">⚙️</button>
              </div>
            </div>

            <div id="capture-area" className="mt-20 relative w-full max-w-xl p-8 bg-gradient-to-br from-[#fff7ed] via-[#fff] to-[#fef3c7] rounded-[2rem] shadow-2xl border border-orange-100">
              <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-yellow-200 via-yellow-500 to-yellow-200 opacity-60"></div>
              <div className="flex justify-center -mt-16 mb-4 relative z-10">
                 <a href="https://www.instagram.com/bakirkoykuyumcusu/" target="_blank">
                   <img src="bk.jpeg" className="h-28 w-28 rounded-full border-[6px] border-white shadow-xl object-cover bg-white" alt="logo" crossOrigin="anonymous" />
                 </a>
              </div>
              <div className="text-center mb-8">
                <h1 className="text-4xl font-serif font-bold text-yellow-800 tracking-tight drop-shadow-sm">Bakırköy Kuyumcusu</h1>
                <div className="text-xs font-bold tracking-[0.3em] text-yellow-600 mt-2 uppercase opacity-80">{new Date().toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'})}</div>
              </div>
              
              <div className="bg-white/90 backdrop-blur-sm rounded-2xl p-6 shadow-inner border border-white/60">
                <Row title="Çeyrek Altın" buy={P.ceyrek_alis || 0} sell={P.ceyrek_satis || 0} />
                <Row title="Ata Altın" buy={P.ata_alis || 0} sell={P.ata_satis || 0} />
                <div className="grid grid-cols-2 gap-4 mt-6">
                  <Box title="22 Ayar Gram" value={P.gram_22 || 0} />
                  <Box title="24 Ayar Gram" value={P.gram_24 || 0} />
                </div>
                <div className="grid grid-cols-3 gap-3 mt-4">
                  <SmallBox title="0.25g (24K)" value={s025} />
                  <SmallBox title="0.50g (22K)" value={s05_22} />
                  <SmallBox title="0.50g (24K)" value={s05_24} />
                </div>
                <div className="mt-6 pt-4 border-t border-dashed border-gray-200 flex justify-between items-center text-[10px] text-gray-400 font-mono">
                  <span>Saat: {ft(lastUpdate)}</span>
                  <span className="tracking-widest font-bold text-gray-300">BAKIRKOYKUYUMCUSU</span>
                </div>
              </div>
              <div className="mt-8 text-center text-yellow-800/40 font-serif italic text-sm">"Güvenin ve Kalitenin Adresi"</div>
            </div>
            
            {stability > 30 && <div className="mt-4 text-xs text-gray-400 animate-pulse">● Fiyatlar güncel</div>}

            {P.duyuru && (
              <div className="fixed bottom-0 left-0 w-full bg-gray-900 text-yellow-500 py-2 z-40 overflow-hidden border-t border-yellow-600 shadow-2xl">
                  <div className="marquee-container">
                      <div className="marquee-content">
                          <span className="text-sm font-bold tracking-[0.2em] uppercase px-8">{P.duyuru} •</span>
                          <span className="text-sm font-bold tracking-[0.2em] uppercase px-8">{P.duyuru} •</span>
                          <span className="text-sm font-bold tracking-[0.2em] uppercase px-8">{P.duyuru} •</span>
                          <span className="text-sm font-bold tracking-[0.2em] uppercase px-8">{P.duyuru} •</span>
                      </div>
                  </div>
              </div>
            )}
         </div>
      )}

      {loginOpen && <LoginModal onClose={()=>setLoginOpen(false)} onLoginSuccess={(u)=>{setUser(u); setLoginOpen(false); setAdminOpen(true);}} />}
      
      {adminOpen && prices && (
          <AdminModal 
            open={adminOpen} 
            draft={prices} setDraft={setPrices} 
            vitrinItems={vitrinItems} refreshVitrin={fetchData}
            onClose={()=>setAdminOpen(false)} 
            onSave={handleSave} 
          />
      )}
      
      {locationOpen && <LocationModal onClose={() => setLocationOpen(false)} />}

    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
