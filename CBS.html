<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kişisel Defterim</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #111827; /* Dark Gray 900 */
            color: #F3F4F6; /* Gray 100 */
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        /* Özel Scrollbar Gizleme */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Mobil Input Stilleri */
        input, textarea, select {
            background-color: #1F2937;
            border: 1px solid #374151;
            color: white;
            font-size: 16px; /* Zoom engelleme */
            border-radius: 0.75rem;
            width: 100%;
            padding: 0.75rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #6366F1; }

        /* Animasyonlar */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

<!-- 
    GÜNCEL SUPABASE SQL YAPISI (RLS & TRIGGER DAHİL):
    
    -- NOTES
    create table if not exists public.notes (
      id bigint generated by default as identity primary key,
      user_id uuid not null references auth.users(id) on delete cascade,
      content text not null,
      created_at timestamptz not null default now()
    );

    -- CUSTOMERS
    create table if not exists public.customers (
      id bigint generated by default as identity primary key,
      user_id uuid not null references auth.users(id) on delete cascade,
      name text not null,
      phone text,
      notes text,
      tags text[] not null default '{}',
      created_at timestamptz not null default now(),
      updated_at timestamptz not null default now()
    );

    -- TASKS
    create table if not exists public.tasks (
      id bigint generated by default as identity primary key,
      user_id uuid not null references auth.users(id) on delete cascade,
      text text not null,
      done boolean not null default false,
      created_at timestamptz not null default now()
    );

    -- TRIGGER (Updated_at Otomasyonu)
    create or replace function public.set_updated_at() returns trigger language plpgsql as $$
    begin new.updated_at = now(); return new; end $$;

    drop trigger if exists trg_customers_updated_at on public.customers;
    create trigger trg_customers_updated_at before update on public.customers
    for each row execute function public.set_updated_at();

    -- RLS & POLICIES (Tam Güvenlik)
    alter table public.notes enable row level security;
    alter table public.customers enable row level security;
    alter table public.tasks enable row level security;
    
    -- (Policies yukarıdaki tanımlara göre Auth UID kontrolü yapar)
-->

    };

    // --- UTILS ---
    const getFormattedDate = (date) => new Date(date).toLocaleString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });
    const getRelativeTime = (date) => {
        const d = new Date(date);
        const now = new Date();
        const diff = Math.floor((now - d) / (1000 * 60 * 60 * 24));
        if (diff === 0) return 'Bugün';
        if (diff === 1) return 'Dün';
        return `${diff} gün önce`;
    };

    // --- LOGIN SCREEN (SUPABASE) ---
    function LoginScreen({ onLoginSuccess }) {
        const [email, setEmail] = React.useState("");
        const [password, setPassword] = React.useState("");
        const [loading, setLoading] = React.useState(false);
        const [error, setError] = React.useState("");

        const handleLogin = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError("");
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                setError("Giriş başarısız: " + error.message);
                setLoading(false);
            } else {
                // Başarılı giriş
                onLoginSuccess(data.user);
            }
        };

        return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-gray-900 text-white p-6 fade-in">
                <div className="mb-8 text-center">
                    <div className="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg">
                        <Icons.Lock />
                    </div>
                    <h1 className="text-2xl font-bold">Kişisel Defter</h1>
                    <p className="text-gray-400 text-sm mt-2">Verilerinize erişmek için oturum açın</p>
                </div>

                <form onSubmit={handleLogin} className="w-full max-w-sm space-y-4">
                    <input type="email" placeholder="E-posta" value={email} onChange={e=>setEmail(e.target.value)} required autoCapitalize="none" />
                    <input type="password" placeholder="Şifre" value={password} onChange={e=>setPassword(e.target.value)} required />
                    
                    {error && <div className="text-red-400 text-sm font-bold text-center">{error}</div>}

                    <button type="submit" disabled={loading} className="w-full bg-indigo-600 py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition disabled:opacity-50">
                        {loading ? "Giriş Yapılıyor..." : "Giriş Yap"}
                    </button>
                </form>
            </div>
        );
    }

    // --- NOTES TAB (SUPABASE) ---
    function NotesTab({ user, searchText }) {
        const [notes, setNotes] = React.useState([]);
        const [newNote, setNewNote] = React.useState("");
        const [loading, setLoading] = React.useState(true);

        const fetchNotes = async () => {
            const { data, error } = await supabase
                .from('notes')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false });
            
            if(data) setNotes(data);
            setLoading(false);
        };

        React.useEffect(() => {
            fetchNotes();
        }, [user]);

        const addNote = async () => {
            if (!newNote.trim()) return;
            const { error } = await supabase.from('notes').insert({ content: newNote, user_id: user.id });
            if (!error) {
                setNewNote("");
                fetchNotes();
            }
        };

        const deleteNote = async (id) => {
            if (confirm("Silmek istiyor musunuz?")) {
                await supabase.from('notes').delete().eq('id', id);
                fetchNotes();
            }
        };

        const filtered = notes.filter(n => n.content.toLowerCase().includes(searchText.toLowerCase()));

        return (
            <div className="flex flex-col h-full fade-in">
                <div className="bg-gray-800 p-4 rounded-2xl mb-4 shadow-lg border border-gray-700">
                    <textarea 
                        rows="3" 
                        placeholder="Hızlı bir şeyler yaz..." 
                        value={newNote}
                        onChange={e => setNewNote(e.target.value)}
                        className="w-full bg-transparent border-none text-white placeholder-gray-500 focus:ring-0 p-0 resize-none text-lg"
                    ></textarea>
                    <div className="flex justify-between items-center mt-2 pt-2 border-t border-gray-700">
                        <span className="text-xs text-gray-500">{new Date().toLocaleDateString('tr-TR', {weekday:'long', day:'numeric', month:'long'})}</span>
                        <button onClick={addNote} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow hover:bg-indigo-700 transition active:scale-95 disabled:opacity-50" disabled={!newNote.trim()}>Kaydet</button>
                    </div>
                </div>

                <div className="flex-1 overflow-y-auto pb-24 space-y-3">
                    {loading ? <div className="text-center text-gray-500 mt-10">Yükleniyor...</div> : 
                     filtered.length === 0 ? <div className="text-center text-gray-500 mt-10 opacity-50">Not bulunamadı.</div> :
                     filtered.map(note => (
                        <div key={note.id} className="bg-gray-800 p-4 rounded-xl border border-gray-700/50 shadow-sm group relative">
                            <p className="whitespace-pre-wrap text-gray-300 leading-relaxed text-sm md:text-base">{note.content}</p>
                            <div className="flex justify-between items-center mt-3">
                                <span className="text-xs text-gray-500 font-medium">{getFormattedDate(note.created_at)}</span>
                                <button onClick={() => deleteNote(note.id)} className="text-gray-600 hover:text-red-400 p-1"><Icons.Trash /></button>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );
    }

    // --- CUSTOMERS TAB (SUPABASE) ---
    function CustomersTab({ user, searchText }) {
        const [customers, setCustomers] = React.useState([]);
        const [isFormOpen, setIsFormOpen] = React.useState(false);
        const [formData, setFormData] = React.useState({ name: '', phone: '', notes: '', tags: [] });
        const [tagInput, setTagInput] = React.useState('');
        const [editingId, setEditingId] = React.useState(null);

        const fetchCustomers = async () => {
            const { data } = await supabase.from('customers').select('*').eq('user_id', user.id).order('updated_at', { ascending: false });
            if(data) setCustomers(data);
        };

        React.useEffect(() => {
             fetchCustomers();
        }, [user]);

        const handleSubmit = async (e) => {
            e.preventDefault();
            const payload = {
                name: formData.name,
                phone: formData.phone,
                notes: formData.notes,
                tags: formData.tags,
                user_id: user.id
                // updated_at trigger ile otomatik set edilecek
            };
            
            if (editingId) {
                await supabase.from('customers').update(payload).eq('id', editingId);
            } else {
                await supabase.from('customers').insert(payload);
            }
            
            setFormData({ name: '', phone: '', notes: '', tags: [] });
            setIsFormOpen(false);
            setEditingId(null);
            fetchCustomers();
        };

        const handleEdit = (cust) => {
            setFormData(cust);
            setEditingId(cust.id);
            setIsFormOpen(true);
        };

        const addTag = () => {
            if (tagInput.trim() && !formData.tags?.includes(tagInput.trim())) {
                const newTags = formData.tags ? [...formData.tags, tagInput.trim()] : [tagInput.trim()];
                setFormData({ ...formData, tags: newTags });
                setTagInput('');
            }
        };

        const removeTag = (t) => {
            setFormData({ ...formData, tags: formData.tags.filter(tag => tag !== t) });
        };
        
        const filtered = customers.filter(c => 
            c.name.toLowerCase().includes(searchText.toLowerCase()) || 
            (c.tags && c.tags.some(t => t.toLowerCase().includes(searchText.toLowerCase())))
        );

        return (
            <div className="flex flex-col h-full relative fade-in">
                {isFormOpen ? (
                    <div className="bg-gray-800 p-4 rounded-2xl border border-gray-700 mb-4 slide-up h-full overflow-y-auto">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-lg">{editingId ? 'Düzenle' : 'Yeni Müşteri'}</h3>
                            <button onClick={() => setIsFormOpen(false)} className="text-gray-400">İptal</button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input placeholder="Ad Soyad" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />
                            <input placeholder="Telefon" type="tel" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} />
                            <textarea placeholder="Özel Notlar (Karakter, istekler...)" rows="3" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})}></textarea>
                            
                            {/* Tagging */}
                            <div className="p-3 bg-gray-900 rounded-xl border border-gray-700">
                                <div className="flex gap-2 mb-2">
                                    <input placeholder="Etiket ekle (Örn: VIP)" value={tagInput} onChange={e => setTagInput(e.target.value)} className="flex-1 text-sm py-2" />
                                    <button type="button" onClick={addTag} className="bg-gray-700 px-3 rounded-lg text-white text-xl font-bold">+</button>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    {formData.tags?.map(t => (
                                        <span key={t} onClick={() => removeTag(t)} className="bg-indigo-900 text-indigo-200 px-2 py-1 rounded text-xs font-bold border border-indigo-700 cursor-pointer">{t} ✕</span>
                                    ))}
                                </div>
                            </div>

                            <button type="submit" className="w-full bg-indigo-600 py-3 rounded-xl font-bold shadow-lg mt-4">Kaydet</button>
                            {editingId && (
                                <button type="button" onClick={async () => {
                                    if(confirm('Silmek istiyor musunuz?')) {
                                        await supabase.from('customers').delete().eq('id', editingId);
                                        setIsFormOpen(false);
                                        fetchCustomers();
                                    }
                                }} className="w-full text-red-400 py-2 text-sm mt-2">Bu Kaydı Sil</button>
                            )}
                        </form>
                    </div>
                ) : (
                    <>
                        <button onClick={() => { setFormData({ name: '', phone: '', notes: '', tags: [] }); setEditingId(null); setIsFormOpen(true); }} className="bg-indigo-600 text-white w-full py-3 rounded-xl font-bold shadow-lg mb-4 flex items-center justify-center gap-2 active:scale-95 transition">
                            <Icons.Plus /> Yeni Müşteri Ekle
                        </button>
                        
                        <div className="flex-1 overflow-y-auto pb-24 space-y-3">
                            {filtered.map(c => (
                                <div key={c.id} onClick={() => handleEdit(c)} className="bg-gray-800 p-4 rounded-xl border border-gray-700 hover:border-indigo-500/50 transition cursor-pointer active:bg-gray-750">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h3 className="font-bold text-lg text-white">{c.name}</h3>
                                            {c.phone && <a href={`tel:${c.phone}`} onClick={e => e.stopPropagation()} className="text-indigo-400 text-sm font-medium mt-1 block">{c.phone}</a>}
                                        </div>
                                        <span className="text-[10px] text-gray-500 bg-gray-900 px-2 py-1 rounded">{getRelativeTime(c.updated_at)}</span>
                                    </div>
                                    {c.notes && <p className="text-gray-400 text-sm mt-2 line-clamp-2">{c.notes}</p>}
                                    <div className="flex flex-wrap gap-1 mt-3">
                                        {c.tags?.map(t => (
                                            <span key={t} className="text-[10px] bg-gray-700 text-gray-300 px-2 py-0.5 rounded border border-gray-600">{t}</span>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </>
                )}
            </div>
        );
    }

    // --- TASKS TAB (SUPABASE) ---
    function TasksTab({ user, searchText }) {
        const [tasks, setTasks] = React.useState([]);
        const [newTask, setNewTask] = React.useState("");

        const fetchTasks = async () => {
            const { data } = await supabase.from('tasks').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
            if(data) setTasks(data);
        };

        React.useEffect(() => {
            fetchTasks();
        }, [user]);

        const addTask = async (e) => {
            e.preventDefault();
            if(!newTask.trim()) return;
            const { error } = await supabase.from('tasks').insert({ text: newTask, done: false, user_id: user.id });
            if(!error) {
                setNewTask("");
                fetchTasks();
            }
        };

        const toggleTask = async (task) => {
            // Optimistic update
            const updatedTasks = tasks.map(t => t.id === task.id ? {...t, done: !t.done} : t);
            setTasks(updatedTasks);
            
            await supabase.from('tasks').update({ done: !task.done }).eq('id', task.id);
            // No fetch needed strictly, but good for sync
        };
        
        const deleteDoneTasks = async () => {
             const doneTasks = tasks.filter(t => t.done);
             if(doneTasks.length === 0) return;
             if(!confirm('Tamamlananları temizle?')) return;
             
             for(let t of doneTasks) {
                 await supabase.from('tasks').delete().eq('id', t.id);
             }
             fetchTasks();
        };

        const filtered = tasks.filter(t => t.text.toLowerCase().includes(searchText.toLowerCase()));

        return (
            <div className="flex flex-col h-full fade-in">
                <form onSubmit={addTask} className="mb-4 relative">
                    <input 
                        placeholder="Yapılacak ekle..." 
                        value={newTask} 
                        onChange={e => setNewTask(e.target.value)} 
                        className="pr-12"
                    />
                    <button type="submit" className="absolute right-2 top-2 bg-indigo-600 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold shadow active:scale-90 transition">+</button>
                </form>

                <div className="flex-1 overflow-y-auto pb-24 space-y-2">
                    {filtered.map(task => (
                        <div key={task.id} onClick={() => toggleTask(task)} className={`flex items-center gap-3 p-4 rounded-xl border cursor-pointer transition select-none ${task.done ? 'bg-gray-800/50 border-gray-800 opacity-50' : 'bg-gray-800 border-gray-700'}`}>
                            <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition ${task.done ? 'bg-indigo-600 border-indigo-600' : 'border-gray-500'}`}>
                                {task.done && <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>}
                            </div>
                            <span className={`flex-1 text-sm md:text-base ${task.done ? 'line-through text-gray-500' : 'text-gray-200'}`}>{task.text}</span>
                        </div>
                    ))}
                    {tasks.filter(t => t.done).length > 0 && (
                        <button onClick={deleteDoneTasks} className="text-center w-full text-xs text-gray-500 py-4 hover:text-white">Tamamlananları Temizle</button>
                    )}
                </div>
            </div>
        );
    }

    // --- APP COMPONENT ---
    function App() {
        const [user, setUser] = React.useState(null);
        const [activeTab, setActiveTab] = React.useState('notes');
        const [searchText, setSearchText] = React.useState("");
        const [showSettings, setShowSettings] = React.useState(false);
        const [loading, setLoading] = React.useState(true);

        // Auth Check
        React.useEffect(() => {
            const checkSession = async () => {
                const { data: { session } } = await supabase.auth.getSession();
                if (session?.user) {
                    setUser(session.user);
                }
                setLoading(false);
            };
            
            checkSession();

            const { data: authListener } = supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    setUser(session.user);
                } else if (event === 'SIGNED_OUT') {
                    setUser(null);
                }
            });

            return () => authListener.subscription.unsubscribe();
        }, []);

        const exportData = async () => {
            if(!user) return;
            const { data: notes } = await supabase.from('notes').select('*').eq('user_id', user.id);
            const { data: customers } = await supabase.from('customers').select('*').eq('user_id', user.id);
            const { data: tasks } = await supabase.from('tasks').select('*').eq('user_id', user.id);
            
            const data = { notes, customers, tasks, exportDate: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type : 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `yedek_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        };

        const handleLogout = async () => {
             await supabase.auth.signOut();
             window.location.reload();
        }

        if (loading) return <div className="min-h-screen flex items-center justify-center bg-gray-900 text-white">Yükleniyor...</div>;

        if (!user) {
            return <LoginScreen onLoginSuccess={(u) => setUser(u)} />;
        }

        return (
            <div className="max-w-md mx-auto h-[100dvh] flex flex-col bg-gray-900 border-x border-gray-800 relative">
                
                {/* Header */}
                <div className="p-4 pt-6 bg-gray-900 border-b border-gray-800 z-10 sticky top-0">
                    <div className="flex justify-between items-center mb-4">
                        <div>
                            <h1 className="text-xl font-bold tracking-tight text-white">Kişisel Defter</h1>
                            <p className="text-xs text-indigo-400 font-medium">{new Date().toLocaleDateString('tr-TR', {weekday:'long', day:'numeric', month:'long'})}</p>
                        </div>
                        <button onClick={() => setShowSettings(!showSettings)} className="bg-gray-800 p-2 rounded-lg text-gray-400 hover:text-white transition">
                            <Icons.Settings />
                        </button>
                    </div>

                    {showSettings && (
                        <div className="absolute top-20 right-4 bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-2xl z-50 w-64 slide-up">
                            <h4 className="font-bold text-sm mb-3 text-gray-300">Ayarlar</h4>
                            <div className="text-xs text-gray-500 mb-2 px-2">{user.email}</div>
                            <button onClick={exportData} className="w-full text-left bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-lg text-sm mb-2">📥 Verileri Yedekle (JSON)</button>
                            <button onClick={handleLogout} className="w-full text-left bg-red-900/30 text-red-400 hover:bg-red-900/50 px-3 py-2 rounded-lg text-sm font-bold">Çıkış Yap</button>
                        </div>
                    )}
                    
                    {/* Search Bar */}
                    <div className="relative">
                        <input 
                            type="text" 
                            placeholder={`${activeTab === 'notes' ? 'Notlarda' : activeTab === 'customers' ? 'Müşterilerde' : 'Yapılacaklarda'} ara...`}
                            value={searchText}
                            onChange={(e) => setSearchText(e.target.value)}
                            className="bg-gray-800 border-gray-700 pl-10 text-sm h-10"
                        />
                        <div className="absolute left-3 top-2.5 text-gray-500 pointer-events-none">
                            <Icons.Search />
                        </div>
                    </div>
                </div>

                {/* Content Area */}
                <div className="flex-1 overflow-hidden p-4 relative">
                    {activeTab === 'notes' && <NotesTab user={user} searchText={searchText} />}
                    {activeTab === 'customers' && <CustomersTab user={user} searchText={searchText} />}
                    {activeTab === 'tasks' && <TasksTab user={user} searchText={searchText} />}
                </div>

                {/* Bottom Navigation */}
                <div className="h-20 bg-gray-900 border-t border-gray-800 grid grid-cols-3 items-center px-2 pb-4 shrink-0 z-20">
                    <button onClick={() => setActiveTab('notes')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition ${activeTab === 'notes' ? 'text-indigo-400 bg-gray-800' : 'text-gray-500 hover:text-gray-300'}`}>
                        <Icons.Note />
                        <span className="text-[10px] font-bold">Notlar</span>
                    </button>
                    <button onClick={() => setActiveTab('customers')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition ${activeTab === 'customers' ? 'text-indigo-400 bg-gray-800' : 'text-gray-500 hover:text-gray-300'}`}>
                        <Icons.Users />
                        <span className="text-[10px] font-bold">Müşteriler</span>
                    </button>
                    <button onClick={() => setActiveTab('tasks')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition ${activeTab === 'tasks' ? 'text-indigo-400 bg-gray-800' : 'text-gray-500 hover:text-gray-300'}`}>
                        <Icons.Check />
                        <span className="text-[10px] font-bold">İşler</span>
                    </button>
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
